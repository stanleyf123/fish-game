<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>幻紋大白鯊・游動樣本</title><style>
*{box-sizing:border-box}body{margin:0;background:#081b29;color:#e6f2f7;font:16px system-ui,-apple-system,sans-serif}main{max-width:960px;margin:auto;padding:24px 16px}header small{color:#e9cd88;font-size:12px;letter-spacing:2px}h1{font-size:26px;margin:10px 0}p{color:#b8ceda;line-height:1.7;margin:8px 0 18px}.stage{position:relative;aspect-ratio:1.5;background:radial-gradient(ellipse at 35% 0,#70b9bb66,transparent 65%),linear-gradient(#16435a,#17617a 50%,#0e344c);border:1px solid #557d8b;border-radius:22px;overflow:hidden;box-shadow:inset 0 0 80px #061e3988}.stage:before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(105deg,transparent 0 11%,#ccfbff08 12% 13%,transparent 14% 22%);transform:rotate(-4deg)}canvas{position:absolute;width:100%;height:100%;inset:0}.label{position:absolute;left:16px;top:14px;background:#0a263ac9;border:1px solid #688798;border-radius:99px;padding:6px 12px;font-size:13px;color:#f6df9d}.floor{position:absolute;bottom:0;height:9%;width:100%;background:linear-gradient(#aec3a500,#b2b69266);border-radius:50% 50% 0 0;pointer-events:none}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}button{border:1px solid #618a9c;background:#163d52;color:#dceaf2;border-radius:12px;padding:12px 16px;font:600 15px inherit;cursor:pointer}button[aria-pressed=true]{background:#ead59c;border-color:#f2dfa6;color:#263c45}.note{font-size:13px;color:#9eb7c6}.status{font-size:13px;color:#cce6d7;min-height:20px}footer{margin-top:20px;border-top:1px solid #24495d;padding-top:14px;color:#a3bdcb;font-size:13px;line-height:1.8}@media(max-width:520px){main{padding:20px 12px}h1{font-size:23px}.stage{aspect-ratio:1.12}canvas{object-fit:contain}.controls button{flex:1;padding:12px 8px}}
</style></head><body><main><header><small>動作樣本・尚未套用正式魚缸</small><h1>幻紋大白鯊</h1><p>保留原本畫風，讓尾根、尾尖和胸鰭分開活動。</p></header><div class="stage"><canvas id="fish" width="960" height="640"></canvas><div class="floor"></div><span id="mode-label" class="label">新版・分部位游動</span></div><div class="controls"><button id="new" aria-pressed="true">看新版動作</button><button id="old" aria-pressed="false">對照原本動作</button><button id="pause" aria-pressed="false">暫停</button></div><div id="status" class="status">載入樣本中…</div><footer>這是一隻的動作確認樣本，尚未替換其他商品。<br>比較重點：尾巴前後段的帶動、胸鰭拍動，以及頭部是否穩定。</footer></main><script src="rig.js?v=1"></script><script>
const image=new Image();image.src='/art/predator-series-v3/white.png';let mode=true,paused=false,draw=null,time=0,last=performance.now();const status=document.querySelector('#status'),label=document.querySelector('#mode-label');
image.onload=()=>{try{draw=SharkRigSample(document.querySelector('#fish'),image);status.textContent='新版：尾根帶動尾尖・胸鰭與背鰭錯開節奏';requestAnimationFrame(frame)}catch(e){status.textContent=e.message}};image.onerror=()=>status.textContent='素材載入失敗，請重新開啟頁面。';
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)time+=dt;if(draw)draw(time,mode);requestAnimationFrame(frame)}
function change(next){mode=next;time=0;document.querySelector('#new').setAttribute('aria-pressed',String(mode));document.querySelector('#old').setAttribute('aria-pressed',String(!mode));label.textContent=mode?'新版・分部位游動':'原本・整張圖波動';status.textContent=mode?'新版：尾根帶動尾尖・胸鰭與背鰭錯開節奏':'原本：共用整張圖波動，供比較動作差異';}
document.querySelector('#new').onclick=()=>change(true);document.querySelector('#old').onclick=()=>change(false);document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'繼續播放':'暫停';e.target.setAttribute('aria-pressed',String(paused));};
</script></body></html>
