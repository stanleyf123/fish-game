<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b2236">
<title>悠游水族箱 · 養魚小遊戲</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%A0%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0b2236;--panel:#10314a;--card:#164463;--accent:#ffd166;--text:#eaf6ff;--muted:#8fb3c9;--pink:#ff7eb6;--ok:#5ee6a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
#app{display:flex;height:100%}
#tankWrap{position:relative;flex:1;min-width:0;overflow:hidden}
#tank{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;position:relative;z-index:1;background:transparent}#tankBg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}
#panel{width:340px;background:linear-gradient(#12395a,#0b2639);display:flex;flex-direction:column;border-left:1px solid #1f4c6d;min-height:0}
@media (max-width:820px){#app{flex-direction:column}#tankWrap{flex:none;height:58vh}#panel{width:100%;flex:1;border-left:none;border-top:1px solid #1f4c6d}}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:3}
.chip{background:rgba(4,22,38,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.chip b{color:var(--accent)}
#coinChip.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.15)}}
.spacer{flex:1}
.hbtn{pointer-events:auto;border:1px solid rgba(255,255,255,.2);background:linear-gradient(#ff8fc2,#e85d9b);color:#fff;font-weight:700;border-radius:999px;padding:7px 14px;font-size:14px;box-shadow:0 3px 12px rgba(232,93,155,.4)}
.hbtn.on{background:linear-gradient(#ffd166,#f0a020);box-shadow:0 3px 12px rgba(240,160,32,.5)}
#breedBar{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:rgba(232,93,155,.9);padding:8px 14px;border-radius:12px;font-size:14px;font-weight:600;display:none;z-index:3;gap:8px;align-items:center;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#aqBar{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:rgba(36,140,90,.92);padding:8px 14px;border-radius:12px;font-size:14px;font-weight:600;display:none;z-index:3;gap:8px;align-items:center;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:96%}
#aqBar button{border:none;border-radius:8px;padding:4px 10px;font-weight:700;background:#fff;color:#1d7a4f}
#aqBar span{overflow:hidden;text-overflow:ellipsis}
.aq-st{font-size:11px;color:#9fd3ff;margin-top:2px}.aq-warn{font-size:12px;color:#ffd166;margin-top:3px}.aq-bad{color:#ff9a9a}.aq-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.1);margin-left:4px;color:#cfe}
.aq-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.aq-acts .buy{flex:1}
.item .buy.sm{min-width:0;padding:6px 8px;font-size:12px}
.tabs button{font-size:13px}
#breedBar button{border:none;border-radius:8px;padding:4px 10px;font-weight:700;background:#fff;color:#c2387a}
#breedBar button:disabled{opacity:.45}
#info{position:absolute;left:10px;top:54px;width:230px;background:rgba(6,26,44,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:12px;font-size:13px;display:none;z-index:4;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#info h3{margin:0 0 2px;font-size:17px;display:flex;align-items:center;gap:6px}
#info .sub{color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;margin:3px 0 7px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
#info .row{display:flex;justify-content:space-between}
#info .btns{display:flex;gap:6px;margin-top:8px}
#info .btns button{flex:1;border:none;border-radius:8px;padding:6px 0;font-weight:700;background:#245a80;color:#fff;font-size:12px}
#info .btns button.warn{background:#7a3a3a}
#info .x{position:absolute;right:8px;top:6px;background:none;border:none;color:var(--muted);font-size:18px}
.rar{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:700;border:1px solid currentColor}
.tabs{display:flex;padding:10px 10px 0;gap:6px}
.tabs button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap;padding:10px 0;border-radius:10px 10px 0 0;border-bottom:3px solid transparent}
.tabs button.on{color:var(--text);background:rgba(255,255,255,.06);border-bottom-color:var(--accent)}
#tabContent{flex:1;overflow-y:auto;padding:10px;min-height:0;-webkit-overflow-scrolling:touch}
.sec{font-size:12px;color:var(--muted);margin:6px 2px 6px;letter-spacing:1px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:8px;border:1px solid rgba(255,255,255,.06)}
.item img{width:64px;height:40px;object-fit:contain;flex:none}
.item .ic{width:64px;height:40px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.item .txt{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .ds{font-size:12px;color:var(--muted);margin-top:2px}
.buy{border:none;border-radius:9px;padding:7px 10px;font-weight:800;background:linear-gradient(#ffd166,#f0a020);color:#4a2c00;font-size:13px;min-width:70px;flex:none}
.buy:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.buy.done{background:#2b6b55;color:#c9ffe8}
.book{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bk{background:var(--card);border-radius:12px;padding:8px;text-align:center;border:1px solid rgba(255,255,255,.06);position:relative}
.bk img{width:100%;height:58px;object-fit:contain}
.bk .nm{font-weight:700;font-size:14px;margin:2px 0}
.bk .ds{font-size:11px;color:var(--muted);min-height:28px}
.bk.lock .nm{color:#6c8aa0}
.bk .cnt{position:absolute;right:8px;top:6px;font-size:11px;color:var(--muted)}
.prog{font-size:13px;margin:4px 2px 10px;color:var(--muted)}
.prog b{color:var(--accent)}
.foot{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid #1f4c6d;font-size:12px;color:var(--muted);gap:8px}
.foot button{border:1px solid #7a3a3a;background:transparent;color:#ff9a9a;border-radius:8px;padding:5px 10px;font-size:12px}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:10px;border:1px solid rgba(255,255,255,.06);font-size:13px}
.card h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.card .row{display:flex;justify-content:space-between;color:#cfe6f5;margin-top:4px}
.card .note{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5}
.card .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.card .acts .buy{flex:1}
.rem{display:flex;gap:8px;padding:6px 0;border-top:1px dashed rgba(255,255,255,.08);line-height:1.45}
.rem:first-of-type{border-top:none}
.rem.warn{color:#ffe1a1}.rem.bad{color:#ffc0c0}.rem.ok{color:#c9ffe8}
.chip.warn{border-color:#ffd166}.chip.bad{border-color:#ff6b6b;color:#ffc0c0}
#modal .box.wide{max-width:440px;text-align:left}
#modal .box.wide h2{text-align:center}
#modal .box.wide p{font-size:14px}
#toasts{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5;width:90%}
.toast{background:rgba(6,26,44,.88);border:1px solid rgba(255,255,255,.15);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;animation:tin .3s ease-out;text-align:center;max-width:100%}
.toast.gold{border-color:#ffcf4d;color:#ffe9a8}.toast.pink{border-color:var(--pink)}.toast.bad{border-color:#ff6b6b;color:#ffc0c0}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
#modal{position:fixed;inset:0;background:rgba(0,10,20,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#modal .box{background:linear-gradient(#174a6e,#0e2e47);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:tin .3s}
#modal h2{margin:0 0 10px;font-size:20px}
#modal p{margin:6px 0;line-height:1.6;color:#cfe6f5}
#modal img{max-width:100%;height:90px;object-fit:contain}
#modal .mb{display:flex;gap:8px;justify-content:center;margin-top:14px}
#modal .mb button{border:none;border-radius:10px;padding:9px 18px;font-weight:800;background:linear-gradient(#ffd166,#f0a020);color:#4a2c00}
#modal .mb button.sec2{background:#2a587a;color:#fff}
/* ---- v2 視覺主題 ---- */
#banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;z-index:6;transition:opacity .3s,transform .35s cubic-bezier(.2,1.4,.4,1)}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .celebrate{background:linear-gradient(180deg,rgba(23,74,110,.95),rgba(10,40,64,.95));border:1px solid rgba(255,209,102,.5);border-radius:18px;padding:14px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.45),0 0 30px rgba(255,209,102,.25)}
#banner b{font-size:17px;background:linear-gradient(90deg,#ffd166,#ff7eb6,#7cc8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#banner img{display:block;margin:6px auto;height:70px}
:root{--glass:rgba(10,38,60,.62);--line:rgba(160,220,255,.16)}
body{background:radial-gradient(120% 80% at 30% 0%,#123d5e,#071a2b)}
#panel{background:linear-gradient(180deg,rgba(20,64,96,.96),rgba(8,30,48,.98));box-shadow:-8px 0 30px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;padding:12px 14px 2px}
.brand .logo{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,#46c3f0,#2a6fd0);box-shadow:0 4px 14px rgba(70,195,240,.35)}
.brand b{display:block;font-size:16px;letter-spacing:1px}.brand small{color:var(--muted);font-size:11px}
.tabs{gap:4px;padding:8px 10px 0}
.tabs button{border-radius:10px;padding:9px 0;transition:background .2s,color .2s,transform .1s}
.tabs button.on{background:linear-gradient(180deg,rgba(255,209,102,.16),rgba(255,255,255,.04))}
#tabContent.tabin{animation:tabIn .28s ease-out}
@keyframes tabIn{from{opacity:0;transform:translateY(8px)}}
.item,.card,.bk{background:linear-gradient(180deg,rgba(32,86,124,.75),rgba(20,60,92,.75));border:1px solid var(--line);transition:transform .15s,border-color .15s}
.item:hover,.bk:hover{border-color:rgba(255,209,102,.35)}
.item .ic{background:rgba(255,255,255,.06);border-radius:10px}
.item img,.bk img{filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
button{transition:transform .08s ease,filter .15s}
button:active:not(:disabled){transform:scale(.94)}
.buy:hover:not(:disabled){filter:brightness(1.08)}
.chip{background:var(--glass);border-color:var(--line)}
.hbtn.ghost{background:var(--glass);box-shadow:none;padding:7px 11px}
#info{background:linear-gradient(180deg,rgba(14,48,74,.92),rgba(6,26,44,.92));animation:tin .2s}
#modal.show .box{animation:pop .32s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.celebrate{position:relative}
.celebrate img{animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,220,120,.6))}
.celebrate h2{background:linear-gradient(90deg,#ffd166,#ff7eb6,#7cc8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes float{50%{transform:translateY(-6px) scale(1.04)}}
.minput{width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;font:inherit;font-size:16px;text-align:center;outline:none}
.minput:focus{border-color:#ffd166;box-shadow:0 0 0 3px rgba(255,209,102,.2)}
.mhint{font-size:12px!important;color:var(--muted)!important}
.foot{padding-bottom:max(8px,env(safe-area-inset-bottom))}
@media (max-width:820px){
  #tankWrap{height:54vh}
  #hud{top:8px;left:8px;right:8px;gap:5px}
  .chip{font-size:12px;padding:4px 9px}
  .hbtn{font-size:12px;padding:5px 10px}
  .brand{display:none}
  .tabs{position:sticky;top:0;z-index:2;background:#123a57;padding-top:6px}
  .tabs button{font-size:13px;padding:8px 0}
  #info{width:auto;right:10px;top:auto;bottom:10px;left:10px}
  #toasts{bottom:12px}
  .foot span:first-child{display:none}
}
/* ---- 會員／雲端 ---- */
.hbtn.acct{background:var(--glass);box-shadow:none;padding:7px 12px;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.hbtn.acct.guest{border-color:rgba(255,209,102,.65);color:#ffe9a8;animation:glow 2.6s ease-in-out infinite}
.hbtn.acct.member{border-color:rgba(94,230,168,.55);color:#c9ffe8}
@keyframes glow{50%{box-shadow:0 0 14px rgba(255,209,102,.45)}}
.hbtn .dot{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#ff5a7a;color:#fff;font-size:11px;margin-left:4px;padding:0 5px;vertical-align:1px}
#gemChip{pointer-events:auto;cursor:pointer}#gemChip b{color:#9fe8ff}
.form{text-align:left;margin-top:4px}
.form label{display:block;font-size:13px;color:#cfe6f5;margin-top:10px;font-weight:600}
.form .minput{text-align:left;margin-top:4px;font-size:15px}
.pwrap{position:relative;display:block}.pwrap .minput{padding-right:56px}
.pwrap .eye{position:absolute;right:6px;top:calc(50% + 2px);transform:translateY(-50%);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:8px;color:#cfe6f5;font-size:12px;padding:4px 8px}
.ferr{color:#ffb0b0;font-size:13px;min-height:20px;margin-top:8px;text-align:center;font-weight:600}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:3px;margin:4px 0 6px}
.seg button{flex:1;border:none;background:none;color:var(--muted);font-weight:700;padding:8px 0;border-radius:9px;font-size:14px}
.seg button.on{background:linear-gradient(#ffd166,#f0a020);color:#4a2c00}
.mbtn{display:block;border:none;border-radius:10px;padding:11px 18px;font-weight:800;background:linear-gradient(#ffd166,#f0a020);color:#4a2c00;width:100%;margin-top:12px;font-size:15px}
.mbtn.sec2{background:#2a587a;color:#fff;margin-top:8px}
.mbtn:disabled{opacity:.6}
.mlist{max-height:52vh;overflow:auto;margin-top:6px}
.mail{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;text-align:left}
.mail.done{opacity:.6}
.mail .t{font-weight:800;font-size:15px}.mail .b{font-size:13px;color:#cfe6f5;margin:4px 0;line-height:1.6}.mail .g{font-size:13px;color:#ffe1a1}
.mail .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acct-card{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:14px;line-height:1.8}
#vipMark{color:#ffd166}
@media (max-width:820px){.hbtn.acct{padding:5px 9px;max-width:38vw}}
.mx-bar{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.mx-chip{border:1px solid #3b6b8f;background:#123552;color:#cfe6ff;border-radius:12px;padding:2px 9px;font-size:12px;cursor:pointer}.mx-chip.on{background:#2f7bc0;color:#fff}.mx-more{display:block;width:100%;margin:6px 0;padding:6px}.mx-badge{margin-left:4px;font-size:13px}.mx-tags{opacity:.85}.mx-warn{text-align:left;font-size:14px;line-height:1.6;padding-left:18px}
/* ---- 成長進化／限定魚／信箱帳號 ---- */
.stage-tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;margin-left:4px;vertical-align:1px;background:rgba(255,255,255,.12);color:#dff}
.stage-tag.s2{background:linear-gradient(90deg,#ffcf4d,#ff9f43);color:#3a2300;font-weight:700}
.stage-tag.s1{background:rgba(124,200,255,.25);color:#cfeeff}
.prem-badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin-left:5px;color:#2b1240;background:linear-gradient(110deg,#9fe8ff,#e7b6ff 40%,#fff3b0 60%,#9fe8ff);background-size:200% 100%;animation:premShine 2.4s linear infinite}
@keyframes premShine{to{background-position:-200% 0}}
.shop-seg{display:flex;gap:6px;margin:2px 0 10px}.shop-seg button{flex:1;padding:8px 6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#dff;font-weight:700;cursor:pointer}
.shop-seg button.on{background:linear-gradient(90deg,rgba(124,200,255,.35),rgba(199,155,255,.35));border-color:rgba(199,155,255,.8);color:#fff}
/* PAY-501 */
#coinChip{pointer-events:auto;cursor:pointer}
.pay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:0 0 10px}
.pay-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 6px 7px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;cursor:pointer;font:inherit;min-width:0}
.pay-card.k-gems{background:linear-gradient(160deg,rgba(124,200,255,.16),rgba(199,155,255,.12))}
.pay-card.k-coins{background:linear-gradient(160deg,rgba(255,209,102,.16),rgba(240,160,32,.08))}
.pay-card:hover:not([disabled]){border-color:rgba(159,232,255,.75)}
.pay-card[disabled]{opacity:.55;cursor:default}
.pay-card .pc-ic{font-size:24px;line-height:1.1}
.pay-card .pc-q{font-size:16px;letter-spacing:.3px}
.pay-card .pc-x{font-size:11px;color:#ffd166;min-height:15px;font-weight:700}
.pay-card .pc-p{margin-top:4px;width:100%;padding:5px 0;border-radius:9px;background:linear-gradient(#ffd166,#f0a020);color:#4a2c00;font-weight:800;font-size:13px}
.pay-card .pc-tag{position:absolute;top:-7px;right:-3px;font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px;background:#ff5d8f;color:#fff;white-space:nowrap}
.pay-soon{background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.4);border-radius:10px;padding:8px 10px;margin:0 0 10px;color:#ffe1a1!important}
.pay-terms{background:var(--card);border-radius:12px;padding:8px 12px;margin:4px 0 10px;font-size:12.5px;border:1px solid rgba(255,255,255,.06)}
.pay-terms summary{cursor:pointer;font-weight:700;color:#cfe8ff}
.pay-tl{margin:8px 0 2px;padding-left:18px;line-height:1.6;color:#cfe0ee;font-size:12.5px;text-align:left}
.pay-tl li{margin-bottom:4px}
.pay-hist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.ph-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;background:var(--card);border-radius:10px;padding:8px 10px;font-size:13px}
.ph-st{flex:none;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.1)}

    // ---------- 混養相容性（以成魚尺寸判斷） ----------
    const pairCache = new Map();
    // 每格會對魚缸內兩兩配對呼叫很多次：用物件鍵（WeakMap→Map）快取，不再每次組字串（效能修正 403）

    // 買魚前檢查：回傳 { allowed, blockers[], level, issues[{sp,name,count,level,reasons}] }
    function checkPurchase(id, fish, capLevel, plLevel, opt) {
      opt = opt || {}; const i = info(id), blockers = [];

    // 整缸報告：所有有問題的組合

    // 魚卡：誰會威脅牠、牠會威脅誰

    }

    // ---------- 即時行為：在 updateFish 中、計算完 tx/ty 後呼叫 ----------
    // env: { dt, W, H, floorY, fishScale(f), stage(f), G2, now, emit(type, data) }
    // 回傳 null（不干預）或 { tx, ty, speedMult }。emit('nip',{att,vic,dmg}) / emit('eat',{pred,prey}) / emit('miss',{pred,prey})
    function steer(f, fish, env) {

    // ---------- careTick：每條魚每段時間呼叫，回傳額外的健康損失（每小時） ----------
    // ctx: { fish, capLevel, stage(f), off, waterOk }

    // ---------- 離線捕食：在 offline()/catchUp 每段結束後呼叫 ----------

    // ---------- 魚店列表：篩選／排序 ----------

    // ---------- UI 小工具（HTML 字串） ----------
    const L = C.labels;
    function tags(id) { const i = info(id); if (!i) return ''; const t = L.temperament[i.temperament]; return `${t[0]}${t[1]}・${C.sizeClasses[i.sizeClass].name} ${i.cm}cm・占 ${i.tankSpace} 格${i.water !== 'fresh' ? '・' + L.water[i.water] : ''}${i.schooling ? `・群游≥${i.minGroup}` : ''}`; }
    const DOT = { ok: '🟢', caution: '🟡', danger: '🔴' };
    // 混養相容性：小圓點＋文字（與「✅ 已收集」區分）

  // 圖鑑：成年型態紀錄（舊存檔：目前已是成年的魚直接記錄）
  s.adult=s.adult&&typeof s.adult==='object'?s.adult:{};for(const k of Object.keys(s.adult))if(!ensureSpecies(k))delete s.adult[k];for(const f of s.fish)if((f.growth||0)>=G2)s.adult[f.sp]=1;
  // 舊存檔升級到空間制（capV<2）：免費升到「裝得下目前所有魚」的最小魚缸等級，避免一進遊戲就爆缸
  if(!(s.capV>=2)){const from=s.up.cap,used=MX?MX.usedSpace(s.fish):s.fish.length;let lv=from;while(lv<CAP_COST.length&&capAt(lv)<used)lv++;if(lv>from){s.up.cap=lv;s._capMig={from,to:lv,used}}s.capV=2}

const capAt=lv=>CFG.capacity.base+CFG.capacity.upgrades.slice(0,lv).reduce((a,u)=>a+u.add,0);
const KEEP=['id','sp','name','hue','size','growth','full','health','cd','coinT','seed','px','py','dir','stress','finDmg','evoFrom','imm','herb','bt'];
function serial(f){if(f.x!=null){f.px=+(f.x/W).toFixed(4);f.py=+(f.y/H).toFixed(4)}const o={};for(const k of KEEP)o[k]=f[k];return o}

const capacity=()=>CFG.capacity.base+CFG.capacity.upgrades.slice(0,S.up.cap).reduce((a,u)=>a+u.add,0)+(AQ&&S?AQ.extraSpace(S):0);
const decoMult=()=>1+S.up.deco.reduce((a,k)=>a+(DECOS[k]?.bonus||0),0);
const decoMut=()=>S.up.deco.reduce((a,k)=>a+(DECOS[k]?.mut||0),0);
const stage=f=>f.growth>=G2?2:f.growth>=G1?1:0;
const fishScale=f=>VS*CFG.display.fishScale*(CFG.display.juvenileScale+(1-CFG.display.juvenileScale)*Math.min(1,f.growth/G2))*f.size*(1-.16*zOf(f))*(SPECIES[f.sp].giant||1)*aqZoom();
const coinValue=f=>Math.max(1,Math.round(SPECIES[f.sp].coin*CFG.stages[stage(f)].coinMultiplier*decoMult()*waterGrade().coinMultiplier*(1+VIP.coinBonus)*(AQ?AQ.coinMult(S)*aqMods(f).coin:1)));
const coinInterval=st=>CFG.coins.intervalSecByStage[st];
const coinRateMult=f=>(f.sick?0:f.full<CFG.hunger.hungryBelow?CFG.coins.hungryMultiplier:1)*(MX?MX.coinMult(f):1);
function ratePerSec(){let r=0;for(const f of S.fish){const st=stage(f),iv=coinInterval(st);if(st>0&&iv)r+=coinValue(f)/((iv[0]+iv[1])/2)*coinRateMult(f)*CFG.care.timeScale}return r}

function makeFish(sp,o={}){const s=SPECIES[sp];return Object.assign({id:uid(),sp,name:pick(NAMES),hue:(s.hue+rand(-8,8)+360)%360,size:rand(.92,1.08),growth:0,full:CFG.hunger.startFullness,starve:0,sick:false,cd:0,coinT:rand(8,16),seed:Math.floor(Math.random()*1e5),health:100},o)}
function addRuntime(f,x,y){const saved=x==null&&f.px!=null;f.x=x??(saved?clamp(f.px*W,20,W-20):rand(60,Math.max(80,W-60)));f.y=y??(saved?clamp(f.py*H,50,floorY()+10):rand(70,Math.max(90,floorY()-40)));f.vx=rand(-10,10);f.vy=0;f.dir=saved&&f.dir?f.dir:Math.random()<.5?1:-1;f.face=f.dir;f.tx=f.x;f.ty=f.y;f.wT=0;f.phase=Math.random()*6;f.stg=stage(f);f.puff=0;f.chomp=0;return f}
function discover(sp,quiet){if(!S.found[sp]){S.found[sp]=1;if(!quiet){Sound.play('discover');celebrate()}return true}return false}
function celebrate(){const cols=['#ffd166','#ff7eb6','#7cc8ff','#5ee6a8','#c79bff','#fff'];for(let i=0;i<90;i++)parts.push({x:W/2+rand(-60,60),y:H*.35,vx:rand(-220,220),vy:rand(-260,-60),life:rand(1.6,2.6),max:2.6,type:'confetti',c:pick(cols),r:rand(3,6),rot:rand(0,6),vr:rand(-8,8)})}

// ---------- 照護系統（真實時間模型；連線中與離線補算共用同一套 careTick） ----------
const HOUR=3600;
const isCleaner=f=>!!SPECIES[f.sp].clean;   // HOTFIX-CARE-401
const bottomFeeder=f=>{const s=SPECIES[f.sp];return !!s&&!!s.role&&s.role!=='swim'};
const minDirtMult=()=>CFG.water.minDirtMult??.35;
const dirtReduce=()=>Math.max(minDirtMult(),filterMult()*(AQ?AQ.dirtMult(S):1));   // 過濾＋水草＋除沫器合計最多減到 35%
const filterMult=()=>CFG.filter.tiers[S.up.filter]?.mult??1;
const cycleFrac=()=>clamp(S.water.cycle/100,0,1);
function waterGrade(){const g=CFG.water.grades,d=S?S.water.dirt:0;return g.find(x=>d<x.below)||g[g.length-1]}
function bioload(){let b=0;for(const f of S.fish)b+=SPECIES[f.sp].bioload*CFG.water.stageBioload[stage(f)]*f.size;return b}
function cleanRates(){let w=0,a=0;for(const f of S.fish){const c=SPECIES[f.sp].clean;if(!c||f.sick)continue;const m=.6+.2*stage(f);w+=(c.wastePerHour||0)*m;a+=(c.algaePerHour||0)*m}return{w,a}}
function cycleDirtMult(){const u=CFG.cycling.uncycledDirtMultiplier;return u+(1-u)*cycleFrac()}
function volumeFactor(){const Wc=CFG.water,ref=+(Wc.volumeRefCapacity??50),e=+(Wc.volumeExponent??.5);if(!(ref>0)||!(e>0))return 1;const v=Math.pow(Math.max(1,capacity()/ref),e);return isFinite(v)&&v>0?v:1}
function dirtRatePerHour(){const Wc=CFG.water;return(bioload()*Wc.dirtPerBioloadHour+S.water.waste*Wc.dirtPerWastePerHour)*dirtReduce()*cycleDirtMult()/volumeFactor()}
function recommendedChangeHours(){const r=dirtRatePerHour(),o=CFG.water.changes[0];return r>0?CFG.water.recommendedDirtMax*o.pct/r:Infinity}
let simNow=Date.now(),careLog=null;
function rotFood(n=1){const vf=volumeFactor();S.water.waste=Math.min(CFG.water.wasteMax,S.water.waste+CFG.food.rotWaste*n/vf);S.water.dirt=Math.min(100,S.water.dirt+CFG.food.rotDirt*n/vf)}
function autoFeed(off){
  const FD=FOODS[S.up.food],hungry=S.fish.filter(f=>(!isCleaner(f)||f.full<CFG.hunger.hungryBelow)&&f.full<CFG.feeder.feedBelowFullness).sort((a,b)=>a.full-b.full);if(!hungry.length)return;
  const pellets=Math.ceil(hungry.length*CFG.feeder.pelletsPerHungryFish);S.water.lastFed=off?simNow:Date.now();
  if(!off){const t=hungry[0];dropFood(clamp(t.x,20,W-20),46+feederY,Math.min(6,pellets));return}
  if(careLog)careLog.feeds++;
  let left=pellets;for(let i=0;i<pellets;i++){const f=S.fish.filter(x=>x.full<CFG.hunger.seekBelow).sort((a,b)=>a.full-b.full)[0];if(!f)break;f.full=Math.min(100,f.full+FD.nutr);f.growth+=FD.grow*careGrowth(f);left--}
  if(left>0)rotFood(left);
}
function careTick(sec,off){
  const C=CFG,Wt=S.water,h=sec/HOUR*C.care.timeScale;if(h<=0)return;
  const B=bioload(),fm=filterMult(),cf=cycleFrac(),Wc=C.water,aqD=AQ?AQ.dirtMult(S):1,aqA=AQ?AQ.algaeMult(S):1;
  const prevWaste=Wt.waste,vf=volumeFactor();
  Wt.waste=Math.min(Wc.wasteMax,Wt.waste+B*Wc.wastePerBioloadHour*fm*h/vf);
  Wt.dirt=Math.min(100,Wt.dirt+(B*Wc.dirtPerBioloadHour+Wt.waste*Wc.dirtPerWastePerHour)*Math.max(minDirtMult(),fm*aqD)*cycleDirtMult()*h/vf);
  Wt.algae=Math.min(100,Wt.algae+(Wc.algaeBasePerHour+Wt.dirt*Wc.algaeDirtFactor)*aqA*h);
  const cr=cleanRates();Wt.waste=Math.max(0,Wt.waste-cr.w*h);Wt.algae=Math.max(0,Wt.algae-cr.a*h);

  Wt.changeCdH=Math.max(0,Wt.changeCdH-h);Wt.siphonCdH=Math.max(0,(Wt.siphonCdH||0)-h);
  const fv=FEEDER[S.up.feeder].iv;if(fv){Wt.feederAccH+=h;while(Wt.feederAccH>=fv){Wt.feederAccH-=fv;autoFeed(off)}}
  const HG=C.hunger,HE=C.health;
  const dirtLoss=Math.max(0,Wt.dirt-HE.healthyDirtBelow)/(100-HE.healthyDirtBelow)*HE.dirtyLossPerHourAt100*(AQ?AQ.diseaseMult(S):1);
  const cycLoss=(1-cf)*C.cycling.riskPerHour*Math.min(1.5,B/Math.max(1,capacity()));
  const mxUsed=MX?MX.usedSpace(S.fish):0;if(AQ)aqCache.o2=AQ.o2State(S,MX?mxUsed:S.fish.length,capacity());const aqCov=AQ?AQ.cover(S):0;
  for(const f of S.fish.slice()){const s=SPECIES[f.sp],st0=stage(f),wasSick=f.sick;
    f.full=Math.max(0,f.full-HG.decayPerHour*s.hungerMultiplier*(st0===0?HG.juvenileDecayMultiplier:1)*h);

    if(loss>.01)f.health-=loss*h;else if(f.full>HG.hungryBelow)f.health+=HE.recoverPerHour*h;
    if((f.herb||0)>medNow)f.health+=medHerbRate()*h;
    f.health=clamp(f.health,0,100);
    if(off&&!C.offline.protection.allowDeath)f.health=Math.max(f.health,C.offline.protection.healthFloor);
    f.sick=f.health<HE.sickBelow;
    if(f.sick!==wasSick){if(off){if(careLog&&f.sick)careLog.sick.add(f.name)}else {toast(f.sick?`🤒 ${f.name} 生病了（${sickReason(f)}）`:`😊 ${f.name} 恢復健康了！`,f.sick?'bad':'');if(f.sick)medSickGA(f)}}
    if(f.full>C.growth.passiveMinFullness&&!f.sick)f.growth+=C.growth.passivePerHour*h*careGrowth(f);
    if(stage(f)>st0){if(off){if(EVO().offlineAnimate!==false&&f.evoFrom==null)f.evoFrom=st0;if(careLog)careLog.evolved.push(f.name)}else grewUp(f,st0)}
    if(f.health<=0)die(f,off);
  }

    if(c.t>CFG.coins.autoCollectSec)collectCoin(c)}

// 配種：先判斷突變（稀有繁殖限定魚來自突變池）；否則同種→同種，跨種→父母其中一種或「A×B 混種」（species/hybrid.js）
function breedResult(a,b){const ra=SPECIES[a.sp].r,rb=SPECIES[b.sp].r,maxR=Math.max(ra,rb);

  const hue=mutated||res.kind==='hybrid'?(s.hue+rand(-12,12)+360)%360:(mixHue(a.hue,b.hue,rand(.3,.7))+rand(-BC.hueJitter,BC.hueJitter)+360)%360;

  const prem=SPECIES[a.sp].premium||SPECIES[b.sp].premium;a.cd=b.cd=prem?Math.max(BREED_CD,premCd()):BREED_CD;if(s.premium){S.pbreed=S.pbreed||{};S.pbreed[sp]=Date.now()}
  for(let i=0;i<16;i++)parts.push({x:child.x,y:child.y,vx:rand(-50,50),vy:rand(-60,0),life:1.4,max:1.4,type:s.premium||s.premiumBlood?'spark':'heart',c:'#fff3b0',r:rand(2,4)});Sound.play('hatch');
  const isNew=discover(sp);Cloud.track('breed',{a:a.sp,b:b.sp,child:sp,kind:res.kind});
  const hyb=res.kind==='hybrid',title=mutated?'✨ 突變誕生！':hyb?'🧬 混種誕生！':s.premium?'💎 限定魚寶寶誕生！':'🐣 新生命誕生！';
  if(isNew||mutated||hyb||s.premium){showModal(`<div class="celebrate"><h2>${title}</h2>${hyb?`<div style="display:flex;align-items:center;justify-content:center;gap:10px"><img src="${preview(a.sp,a.hue)}" alt="" style="height:56px"><b style="font-size:22px">×</b><img src="${preview(b.sp,b.hue)}" alt="" style="height:56px"></div>`:''}<img src="${preview(sp,hue)}"><p><b>${esc(child.name)}</b>（${esc(s.name)}）<span class="rar r${s.r}">${RARITY[s.r]}</span>${s.premiumBlood?'<span class="prem-badge">💎血統</span>':''}${s.premium?'<span class="prem-badge">💎限定</span>':''}</p>${isNew?`<p>📖 圖鑑新增了一個${hyb?'混種':'品種'}！</p>`:''}<p style="font-size:13px">父母：${esc(a.name)}（${esc(SPECIES[a.sp].name)}）× ${esc(b.name)}（${esc(SPECIES[b.sp].name)}）${prem?`<br>💎 限定魚父母需要休息 ${fmtDur(premCd()/3600)}`:''}</p></div>`,[['太棒了！']]);if(!isNew)celebrate()}

function offline(sec){if(sec<CFG.offline.minAwaySec)return;const OFFLINE_CAP=offCap();
  const rep=catchUp(sec);
  const el=Math.min(sec,OFFLINE_CAP);const earn=Math.floor(ratePerSec()*el*OFFLINE_RATE);S.coins+=earn;
  const g=waterGrade(),Wt=S.water;let lines=[];
  if(rep){if(rep.feeds)lines.push(`⚙️ 自動餵食器餵了 ${rep.feeds} 次`);
    lines.push(`💧 水質：${g.icon} ${g.name}（污染度 ${Math.round(rep.before.dirt)} → ${Math.round(Wt.dirt)}）`);
    if(rep.cycled)lines.push('✅ 離開期間完成了養水！');else if(Wt.cycle<100)lines.push(`🦠 養水進度 ${Math.floor(rep.before.cycle)}% → ${Math.floor(Wt.cycle)}%`);
    const hungry=S.fish.filter(f=>f.full<CFG.hunger.hungryBelow).length;if(hungry)lines.push(`🍽 有 ${hungry} 條魚肚子餓了`);
    if(rep.sick.size)lines.push(`🤒 ${[...rep.sick].slice(0,4).join('、')} 身體不舒服`);
    if(rep.dead.length)lines.push(`💧 ${rep.dead.join('、')} 離開了…`);
    if(rep.eaten&&rep.eaten.length)lines.push(`🦈 ${rep.eaten.slice(0,4).join('、')}`);
    if(rep.plants&&rep.plants.length)lines.push(`🥀 ${[...new Set(rep.plants)].slice(0,4).join('、')} 枯萎了`);
    if(AQ&&S.plants.some(p=>AQ.isOver(p)))lines.push('✂ 有水草長得太長了，到 🌿 造景 修剪可以得到插枝');
    if(rep.evolved&&rep.evolved.length)lines.push(`✨ ${[...new Set(rep.evolved)].slice(0,4).join('、')} 長大了！馬上就要進化…`);}
  const hh=Math.floor(el/3600),mm=Math.floor(el%3600/60),dd=sec/86400;
  showModal(`<h2>🌙 歡迎回來！</h2><p>你離開了 ${dd>=1?fmtDur(sec/3600):(hh?hh+' 小時 ':'')+mm+' 分鐘'}</p>${earn>0?`<p>魚兒們幫你存下了 <b style="color:#ffd166;font-size:20px">🪙 ${fmt(earn)}</b>${sec>OFFLINE_CAP?`<br><small>（收益上限 ${+(OFFLINE_CAP/3600).toFixed(1)} 小時）</small>`:''}</p>`:''}<p style="font-size:13px;text-align:left">${lines.join('<br>')}</p>`,[['好的']]);save();refreshUI(true)}

    C.busy=false;
    if(r.ok){C.lastSync=Date.now();setMeta({pid:C.player&&C.player.id,last:st.last});setStatus('ok')}
    else if(r.tooFrequent){C.pending=C.pending||st;C.timer=setTimeout(push,2500);return'tooFrequent'}
    else if(r.conflict){if(r.save)adopt(r.save,'conflict');return'conflict'}

// 由存檔物件建立執行中的魚缸（開局、雲端同步、登入、領取信箱共用）
function loadState(saved){S=sanitize(Object.assign(freshState(),saved));foods=[];coins=[];closeInfo();setBreed(false);S.fish.forEach(f=>{addRuntime(f);f.size=f.size||1});if(S.leftover){rotFood(S.leftover);S.leftover=0}uiSig='';refreshUI(true);
  if(S._capMig){const m=S._capMig;delete S._capMig;const nm=(CFG.capacity.upgrades[m.to-1]||{}).name||`Lv${m.to}`;setTimeout(()=>toast(`🏠 魚缸改用「空間」計算：已免費升級為「${nm}」（${capacity()} 格），原本的魚都住得下！`,'gold'),1200);save()}}
// ⚔️ 英雄魚（HERO-V4；前端模組 /sdk/hero.js；所有數值／扣款／戰鬥結果都在伺服器）
let heroUI=null;
async function openHero(){
  Sound.init();Sound.play('click');
  const C=Cloud.state;
  if(!C.online||!C.player){toast('⚔️ 英雄魚需要連線到雲端','bad');return}
  if(heroUI)return;
  const base=window.AQUARIUM_API_BASE!=null?String(window.AQUARIUM_API_BASE):'';
  const load=src=>new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)});
  if(!window.FishRender&&!await load(base+'/sdk/fishrender.js'))return toast('載入失敗，請稍後再試','bad');
  if(!window.HeroUI&&!await load(base+'/sdk/hero.js'))return toast('載入失敗，請稍後再試','bad');
  const wrap=document.createElement('div');wrap.id='heroWrap';wrap.style.cssText='position:fixed;inset:0;z-index:80;background:rgba(0,6,12,.88);overflow:auto;padding:max(12px,env(safe-area-inset-top)) 8px 24px';
  const box=document.createElement('div');box.style.cssText='max-width:980px;margin:0 auto';wrap.appendChild(box);document.body.appendChild(wrap);
  const gaUnhook=window.FFGA?FFGA.hookHero():()=>{};const close=()=>{gaUnhook();if(heroUI)heroUI.destroy();heroUI=null;wrap.remove();refreshUI(true)};
  heroUI=HeroUI.mount(box,{baseUrl:base,getToken:()=>localStorage.getItem('fishsdk.token'),
    getSpecies:id=>ensureSpecies(id)?SPECIES[id]:null,
    beforeSpend:()=>Cloud.pushNow(),
    onSaveChanged:async x=>{S.coins=Math.max(0,S.coins-(x.amount||0));try{await C.sdk.loadSave()}catch(e){}save();refreshUI(true)},
    onNeedRegister:msg=>{close();Cloud.acctModal('register',msg||'英雄魚對戰只開放給註冊會員')},
    onClose:close});
}
$('#heroBtn').onclick=openHero;
async function boot(){
  const hasCloud=await Cloud.init();
  let remote=await fetchRemoteConfig();
  if(!remote&&hasCloud)remote=await Cloud.config();
  try{applyConfig(remote||GAME_CONFIG)}catch(e){console.warn('設定套用失敗，改用內建 GAME_CONFIG',e);applyConfig(GAME_CONFIG)}
  resize();
  let saved=loadSave();
  const pick=hasCloud?await Cloud.resolveStart(saved):null;
  if(pick&&pick.source==='cloud'){saved=pick.save;writeLocal(saved)}
  if(saved){loadState(saved);offline((Date.now()-(S.last||Date.now()))/1000)}else newGame();
  Cloud.afterStart(pick);
  PayUI.boot();
  window.addEventListener('resize',resize);
  last=performance.now();requestAnimationFrame(loop);
  try{if(window.FFGA){FFGA.startAfterPaint(CFG);const pl=Cloud.state&&Cloud.state.player;if(pl)FFGA.setUser(pl)}}catch(e){}
}
boot();
