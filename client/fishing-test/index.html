/* ---------- fight panel ---------- */
#fight{position:fixed;left:52px;right:10px;top:calc(env(safe-area-inset-top) + 88px);z-index:5;display:none;border-radius:16px;padding:8px 11px 9px;color:#fff;background:linear-gradient(180deg,rgba(12,34,58,.86),rgba(4,16,30,.86));border:1.5px solid rgba(255,214,140,.5);box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none}

/* ---------- gesture hint (one clear instruction per phase) ---------- */
.gest{position:fixed;left:0;right:0;top:66%;z-index:6;display:none;flex-direction:column;align-items:center;pointer-events:none;color:#fff;text-align:center}
.gest.show{display:flex}
.gest .hand{position:relative;width:86px;height:86px}
.gest .hand svg{position:absolute;left:21px;top:16px;width:46px;height:62px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.gest .ring{position:absolute;left:23px;top:4px;width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.9);opacity:0}
.gest .ttl{font-size:27px;font-weight:900;letter-spacing:1px;-webkit-text-stroke:1px rgba(0,0,0,.35);text-shadow:0 3px 8px rgba(0,0,0,.65),0 0 2px #000;margin-top:2px}

.gest .ttl em{font-style:normal;color:#ffd36a}
/* hold: press down and stay, ring fills */
.gest.g-hold .hand svg{animation:gHold 1.6s ease-in-out infinite}
.gest.g-hold .ring{animation:gHoldR 1.6s ease-in-out infinite}
@keyframes gHold{0%,12%{transform:translateY(-10px)}26%,82%{transform:translateY(2px) scale(.94)}100%{transform:translateY(-10px)}}
@keyframes gHoldR{0%,20%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(.8);border-color:#ffd36a}80%{opacity:1;transform:scale(1.25);border-color:#46e09a}100%{opacity:0;transform:scale(1.4)}}
/* release: finger lifts up */
.gest.g-release .hand svg{animation:gRel .7s ease-out infinite}
@keyframes gRel{0%{transform:translateY(2px) scale(.94)}60%,100%{transform:translateY(-16px);opacity:.6}}
.gest.g-release .ring{animation:gRelR .7s ease-out infinite}
@keyframes gRelR{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
/* mash: fast double taps */
.gest.g-tap .hand svg{animation:gTap .28s ease-in-out infinite}
.gest.g-tap .ring{animation:gTapR .28s ease-out infinite}
@keyframes gTap{0%,100%{transform:translateY(-8px)}50%{transform:translateY(2px) scale(.93)}}
@keyframes gTapR{0%,40%{opacity:0;transform:scale(.5)}55%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
/* wait: hand off, crossed */
.gest.g-wait .hand svg{opacity:.55;animation:gWait 2.4s ease-in-out infinite}
@keyframes gWait{0%,100%{transform:translateY(-14px)}50%{transform:translateY(-20px)}}
.gest.g-wait .ring{opacity:1;border-color:#ff6b6b;width:58px;height:58px;left:14px;top:12px;background:linear-gradient(45deg,transparent 46%,#ff6b6b 46% 54%,transparent 54%)}
/* lure: drag down (往回拉), then sway left/right (搖竿) */
.gest.g-lure .hand svg{animation:gLure 3.6s ease-in-out infinite}
.gest.g-lure .ring{animation:gLureR 3.6s ease-out infinite;border-color:#7fd8ff}
.gest.g-lure .hand::before,.gest.g-lure .hand::after{content:"";position:absolute;left:50%;pointer-events:none;opacity:0}
.gest.g-lure .hand::before{top:44px;width:4px;height:34px;margin-left:-2px;border-radius:3px;background:linear-gradient(180deg,rgba(127,216,255,0),#7fd8ff);animation:gLureTr 3.6s ease-out infinite}
.gest.g-lure .hand::after{top:30px;width:92px;height:4px;margin-left:-46px;border-radius:3px;background:linear-gradient(90deg,rgba(127,216,255,0),#7fd8ff 30%,#7fd8ff 70%,rgba(127,216,255,0));animation:gLureTr2 3.6s ease-out infinite}
@keyframes gLure{0%,6%{transform:translate(0,-12px)}10%{transform:translate(0,-8px) scale(.94)}28%{transform:translate(0,14px) scale(.94);opacity:1}34%{transform:translate(0,16px);opacity:0}40%{transform:translate(0,-6px);opacity:0}46%{transform:translate(0,-6px) scale(.94);opacity:1}58%{transform:translate(-26px,-6px) scale(.94)}76%{transform:translate(26px,-6px) scale(.94)}88%{transform:translate(0,-6px) scale(.94)}100%{transform:translate(0,-12px)}}
@keyframes gLureR{0%,8%{opacity:0;transform:scale(.5)}12%{opacity:1;transform:scale(.85)}24%{opacity:0;transform:translateY(24px) scale(1.2)}44%{opacity:0;transform:scale(.5)}48%{opacity:1;transform:scale(.85)}60%{opacity:0;transform:scale(1.3)}100%{opacity:0}}
@keyframes gLureTr{0%,12%{opacity:0;transform:scaleY(.2)}26%{opacity:.95;transform:scaleY(1)}36%,100%{opacity:0}}
@keyframes gLureTr2{0%,50%{opacity:0;transform:scaleX(.3)}62%,80%{opacity:.9;transform:scaleX(1)}92%,100%{opacity:0}}
.gest .gk{display:inline-flex;align-items:center;gap:3px;margin:3px 3px 4px;padding:3px 10px;border-radius:999px;background:rgba(6,24,40,.72);border:1.5px solid rgba(127,216,255,.6);box-shadow:0 2px 6px rgba(0,0,0,.35);font-size:13px;color:#e6f7ff;text-shadow:none}
.gest.g-lure .ttl em{color:#7fd8ff}
#pityChip{position:fixed;left:50px;top:calc(env(safe-area-inset-top) + 264px);z-index:4;display:none;align-items:center;gap:4px;padding:3px 8px 3px 5px;border-radius:999px;background:linear-gradient(180deg,rgba(40,14,52,.86),rgba(20,6,30,.86));border:1.5px solid rgba(255,160,220,.7);box-shadow:0 0 10px rgba(255,120,200,.35);color:#fff;font-size:11px;pointer-events:none;transition:opacity .2s}
#pityChip span{font-size:13px}#pityChip b{font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}#pityChip i{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}#pityChip u{display:block;height:100%;background:linear-gradient(90deg,#ff8fc6,#ffd36a)}
#pityChip.pity-night{border-color:rgba(190,190,255,.8);box-shadow:0 0 10px rgba(150,150,255,.4)}#pityChip.pity-night u{background:linear-gradient(90deg,#8f93ff,#e4e6ff)}

@keyframes lureS{0%{transform:translate(60px,26px) scale(.7);opacity:0}30%{opacity:.8}100%{transform:translate(4px,16px) scale(1);opacity:.9}}
.tsw{position:fixed;left:-99px;top:-99px}
.gest.g-tap .ttl{color:#ffd36a;animation:pulseT .28s ease-in-out infinite}
@keyframes pulseT{50%{transform:scale(1.08)}}

  const perfect0=p>=PERF[0]&&p<=PERF[1];G.out=rollOutcome(S.spot,perfect0);   // 先用目前的餌擲骰，再扣餌（最後一個餌也算數）

  if(s==='shake'){SFX.shake&&SFX.shake();vib([25,30,25,30,25])}
  const CO={jump:['跳出水面！','#9fe8ff'],dive:['往下鑽！穩住','#c9a2ff'],shake:['甩頭！別讓線鬆','#ffd36a'],rest:tired?['魚累了，快收線！','#7dffc0']:null};if(CO[s]&&s!==F.state)callout(CO[s][0],CO[s][1]);

  else if(boot.grip>=.24&&G.hold&&F.o.kg>2&&Math.random()<.35)pop('釘鞋穩住了！','#9fe8ff')}
function callout(txt,col){G.callout={txt,col,t:0}}

function fishScreen(F){const z=clamp(F.D/F.D0*F.z0,.015,.95);let x=clamp(xOf(F.lx,z),W*.2,W*.8),y=yOf(z),s=gS(z);return{x,y,s,z}}
function updateFight(dt){const F=G.fish,o=F.o,rod=gear('rod'),ln=gear('line'),reel=gear('reel'),boot=gear('boot'),hk=gear('hook'),Ef=Math.pow(rod.power,.6)*Math.pow(ln.str,.6);

  const calm=F.calm>0;if(calm){F.calm-=dt;F.state='rest';F.jump=null;F.sT=Math.max(F.sT,.4);if(F.calm<=0)abCalmEnd(F)}

  if(F.jump){F.jump.t+=dt;if(G.hold)F.T+=46*dt*ln.stretch/rod.ctrl;if(F.jump.t>=F.jump.dur){const P=fishScreen(F);splash(P.x,P.y,P.s,22,1.2);ripple(P.x,P.y,P.s,70,1.2,.9);SFX.splash(1);F.jump=null;F.reveal=true}}
  if(F.state==='dive')F.depth=Math.min(1,F.depth+dt*.5);else F.depth=Math.max(.15,F.depth-dt*.35);
  // 洩力（捲線器）

  // HUD

  $('#fName').innerHTML=o.kind!=='fish'?'沉甸甸的東西…':F.reveal?`<span class="r${o.r}" style="color:${RARITY[o.r].c}">${E(sp.name)}</span>`:'？？？';
  $('#fWt').textContent=o.kind==='fish'?`${F.pers.n?F.pers.n+' · ':''}約 ${o.kg<1?Math.round(o.kg*1000)+'g':o.kg.toFixed(1)+'kg'}`:'';

function snapLine(){const F=G.fish;SFX.snap();vib([120,40,200]);flash('rgba(255,60,60,.4)');pop('斷線了！<small>拉力到紅色要放開</small>','#ff8a8a');S.stats.snaps++;save();G.lineBreak={t:0};G.tip.vx+=300;G.tip.vy-=500;const P=fishScreen(F);G.flee={x:P.x,y:P.y,t:0,dir:F.vlx<0?-1:1,sp:F.o.kind==='fish'?spInfo(F.o.id):null};G.fish=null;setStrain(0);setSt('lost');hint(null)}

/* ---------- update ---------- */
function update(dt){G.t+=dt;G.stT+=dt;const st=G.st;
  if(st==='charge'){G.chargeT+=dt;const ph=(G.chargeT/1.25)%2;G.charge=ph<1?ph:2-ph;G.reelA+=dt*2}

  else if(st==='hook'){const h=G.hook;h.t+=dt;h.m=Math.max(0,h.m-h.drain*dt);G.float&&(G.float.dip=1.1);renderMash();if(h.t>=h.lim){escape('沒鉤住！','咬鉤後要更快連點');}}
  else if(st==='fight')updateFight(dt);
  else if(st==='landing'){const L=G.land;L.t+=dt;L.ph+=dt*16;if(Math.random()<dt*14&&L.t<1.2){const p=landPos(L);G.parts.push({x:p.x+rnd(-8,8),y:p.y+10,vx:rnd(-20,20),vy:rnd(0,40),life:.7,t:0,r:rnd(1.2,2.4),col:'rgba(220,245,255,.9)'})}if(L.t>=1.25){setSt('result');showCatch()}}

  const R=rodGeom(),rodLen=Math.hypot(R.b.x-R.t0.x,R.b.y-R.t0.y);let tx=0,ty=0,load=0,to=null;
  if(st==='charge'){const c=G.charge;tx=70*c;ty=-110*c}

function fishLenPx(o){return clamp(34+Math.log2((o.cm||20)+1)*17,44,200)}
function drawFightFish(F,t){const o=F.o,P=fishScreen(F);
  if(o.kind!=='fish'){ctx.globalAlpha=.4;ctx.fillStyle='#021a26';ctx.beginPath();ctx.ellipse(P.x,P.y+18*P.s,30*P.s,10*P.s,0,0,7);ctx.fill();ctx.globalAlpha=1;return P}
  const sp=spInfo(o.id),L=fishLenPx(o)*P.s*1.25,dir=F.vlx<0?-1:1;F.ph+=G.dtl*(F.state==='rest'?5:F.state==='dart'||F.state==='run'?20:12);
  const amp=F.state==='shake'?.55:F.state==='dart'?.35:.2;
  if(F.jump){const k=F.jump.t/F.jump.dur,y=P.y-Math.sin(k*Math.PI)*F.jump.h*P.s,rot=(k-.5)*1.6*dir;const src=fishSrc(sp,o.variant);
    ctx.save();ctx.translate(P.x,y);ctx.rotate(-rot*.6);ctx.scale(dir,1);if(src){if(o.variant||sp.fx)drawSheen(ctx,src,0,0,L,F.ph,.4,sp,o.variant||'fx',t);else drawSway(ctx,src,0,0,L,F.ph,.4,sp)}else drawFishShape(ctx,sp,L,{variant:o.variant});ctx.restore();
    if(Math.random()<.5)G.parts.push({x:P.x+rnd(-L/3,L/3),y:y+rnd(0,10),vx:rnd(-30,30),vy:rnd(-10,40),life:.6,t:0,r:rnd(1,2.2),col:'rgba(230,250,255,.9)'});return{x:P.x,y,s:P.s}}
  const near=clamp((7-F.D)/5,0,1),dep=F.depth,yy=P.y+(10+38*dep)*P.s;
  const sil=fishSil(sp,(SP().night||SP().boat)?'#00040c':'#03202e');
  ctx.save();ctx.translate(P.x,yy);ctx.scale(dir,.72+.28*near);
  if(sil)drawSwayA(ctx,'fsil',sil,0,0,L*1.05,F.ph,amp,sp,((SP().boat||SP().night)?.82-.25*dep:.62-.3*dep)*(1-near*.7));
  if(near>0){const src=fishSrc(sp,o.variant);if(src)drawSwayA(ctx,'fcol',src,0,-near*4,L,F.ph,amp,sp,near*.92)}
  ctx.restore();ctx.globalAlpha=1;
  if(sp.fx||o.variant==='gold'){if(Math.random()<.25)G.sparks.push({x:P.x+rnd(-L/2,L/2),y:yy+rnd(-8,8),vx:0,vy:-20,life:.8,t:0,col:sp.fx?'#ffb3ff':'#ffe27a',r:1.6})}
  return{x:P.x,y:P.y,s:P.s}}
function drawLanding(L,t){const o=L.o,p=landPos(L);
  if(o.kind!=='fish'){const im=loadImg(icon(o.kind==='chest'?'ic_chest':'ic_bottle'));if(okImg(im))ctx.drawImage(im,p.x-34,p.y,68,68);return{x:p.x,y:p.y}}
  const sp=spInfo(o.id),src=fishSrc(sp,o.variant),L2=clamp(fishLenPx(o)*1.05,70,175);
  ctx.save();ctx.translate(p.x,p.y+L2*.5);ctx.rotate(-Math.PI/2+Math.sin(L.ph*.5)*.18);
  if(src){if(o.variant||sp.fx)drawSheen(ctx,src,0,0,L2,L.ph,.5,sp,o.variant||'fx',t);else drawSway(ctx,src,0,0,L2,L.ph,.5,sp)}else drawFishShape(ctx,sp,L2,{variant:o.variant});

function drawFlee(t){const f=G.flee;if(!f||!f.sp)return;const sil=fishSil(f.sp,'#03202e');if(!sil)return;ctx.save();ctx.translate(f.x+f.dir*f.t*160,f.y+f.t*20+12);ctx.scale(f.dir,.7);drawSwayA(ctx,'flee',sil,0,0,70,t*25,.4,f.sp,.5*(1-f.t/1.6));ctx.restore();ctx.globalAlpha=1}
function drawWaitShadow(t){const w=G.wait,f=G.float;if(G.st!=='wait'||!w||!f||G.out.kind!=='fish')return;const k=clamp(w.t/w.bite+(w.lk||0),0,1);if(k<.35)return;const sp=spInfo(G.out.id),crystal=S.eq.float==='crystal';
  const sil=fishSil(sp,crystal?RARITY[G.out.r].c:'#03202e');if(!sil)return;const s=gS(f.z),a=w.shadow.a+t*.6,rad=(1-k)*60*s+10*s,x=xOf(f.lx,f.z)+Math.cos(a)*rad,y=yOf(f.z)+14*s+Math.sin(a)*rad*.3;
  ctx.save();ctx.translate(x,y);ctx.scale(Math.sin(a)>0?-1:1,.6);drawSwayA(ctx,'wsh',sil,0,0,fishLenPx(G.out)*s*1.1,t*10,.25,sp,(crystal?.4:.18)*(k-.35)/.65);ctx.restore();ctx.globalAlpha=1}
let lastT=0;G.dtl=0;
function frame(ts){const dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;G.dtl=dt;try{perfTick(dt);update(dt);draw(dt)}catch(e){console.error(e)}requestAnimationFrame(frame)}
function draw(dt){const t=G.t;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  ctx.save();if(SP().boat){const a=Math.sin(t*.7)*.012,b=Math.sin(t*.9)*4;ctx.translate(W/2,H);ctx.rotate(a);ctx.translate(-W/2,-H+b);ctx.scale(1.03,1.03);ctx.translate(-W*.015,-H*.015)}
  if(G.stumble){ctx.translate(Math.sin(t*50)*5*G.stumble,0)}if(G.shk){ctx.translate(Math.sin(t*61)*5*G.shk,Math.cos(t*47)*2.5*G.shk)}
  drawBackground(t);drawAmbientFish(t,dt);drawSceneFx(t,dt);
  const tint=todTint();if(tint){ctx.globalCompositeOperation=tint.op;ctx.fillStyle=tint.c;ctx.fillRect(-20,-20,W+40,H+40);ctx.globalCompositeOperation='source-over'}
  drawWaitShadow(t);drawFlee(t);
  let target=null,tension=0;const st=G.st,f=G.float;
  if(st==='fight'&&G.fish){const p=drawFightFish(G.fish,t);target={x:p.x,y:p.y};tension=G.fish.T/100*(G.hold?1:.7)}
  if(f&&(st==='flight'||st==='wait'||st==='hook')){let x,y,s;if(st==='flight'){const R=rodPoints(),tp=R[R.length-1],k=f.t;x=lerp(tp.x,xOf(f.lx,f.z),k);y=lerp(tp.y,yOf(f.z),k)-Math.sin(k*Math.PI)*H*.16;s=lerp(.9,gS(f.z),k)}else{x=xOf(f.lx,f.z);y=yOf(f.z);s=gS(f.z)}
    if(Math.random()<dt*.6&&st==='wait')ripple(x,y,s,16,1.6,.35);drawFloat(x,y,s,st==='flight'?0:f.dip,t,st);target={x,y:y-(st==='flight'?0:4*s)};tension=st==='hook'?.75:st==='wait'?.12:.02}
  drawWeatherWater(t,dt);drawFx(dt);ctx.restore();
  // things held by the angler (not rocking)
  let land=null;if(st==='landing'&&G.land){land=landPos(G.land);target=land;tension=.8}
  const R=drawRod(t);
  if(G.lineBreak&&G.lineBreak.t<1){const k=G.lineBreak.t;ctx.strokeStyle=lineStyle(t);ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(R.tip.x,R.tip.y);for(let i=1;i<=10;i++){const u=i/10;ctx.lineTo(R.tip.x-u*60+Math.sin(u*9+k*20)*14*(1-k),R.tip.y+u*120*(.3+k))}ctx.stroke();drawLine(R,null,0,t)}
  else drawLine(R,target,tension,t);
  if(land)drawLanding(G.land,t);drawCallout(dt);
  drawWeatherTop(t,dt);if(st==='charge')drawChargeMeter();
}

  for(let i=AB.bub.length-1;i>=0;i--){const b=AB.bub[i];b.t+=dt;if(b.t>b.life){AB.bub.splice(i,1);continue}b.vx*=.97;b.vy=b.vy*.97-18*dt;b.x+=b.vx*dt+Math.sin((b.t+i)*5)*.4;b.y+=b.vy*dt;

function abDrawTrail(pts){const st=G.st,live=st==='charge'||(st==='flight'&&G.stT<.55);

const HOLD_M={"hold_kai":[437,216.1,388.0,0.0,262.9,417.3,12.0],"lift_kai":[522,261.1,59.0,2.7,272.1,503.5,83.0],"hold_haru":[629,265.1,273.8,15.1,257.5,604.9,16.8],"lift_haru":[586,297.8,70.7,2.5,327.7,565.9,104.3],"hold_chen":[487,216.8,418.6,12.7,220.4,477.7,17.3],"lift_chen":[605,303.7,59.1,1.8,340.2,585.7,91.5],"hold_miki":[533,300.0,354.7,-11.7,253.3,470.1,13.7],"lift_miki":[552,274.2,87.2,-4.2,326.7,533.9,121.7],"hold_pen":[501,199.1,341.8,17.8,162.9,392.3,15.3],"lift_pen":[634,326.4,64.0,-3.4,302.3,615.3,77.2],"hold_rin":[510,205.5,369.6,15.3,220.1,465.1,13.6],"lift_rin":[555,275.8,70.6,3.8,301.7,536.8,101.5],"hold_rex":[530,233.1,402.7,10.5,257.4,518.8,19.7],"lift_rex":[531,267.1,68.7,4.1,291.9,513.0,92.0],"hold_leo":[516,237.0,336.1,16.5,231.0,515.9,15.4],"lift_leo":[543,269.2,56.0,3.0,270.5,525.0,77.5],"hold_boss":[513,170.8,400.4,18.5,163.2,374.9,10.4],"lift_boss":[468,230.0,77.0,5.4,273.8,448.7,104.4]};
function holdPick(o,sp){const fx=!!(sp&&sp.fx),spec=fx||!!o.variant||o.r>=3;
  const pose=(o.giant||o.cm>=50||(fx&&o.cm>=30))?'lift':'hold';
  const kf=pose==='hold'?clamp(.9+((o.cm||10)-5)/40,.9,1.55):clamp(.8+((o.cm||50)-50)/250,.8,1.15);
  const glow=fx?'rgba(255,150,240,.95)':o.variant==='gold'?'rgba(255,214,90,.95)':o.variant==='albino'?'rgba(170,150,255,.85)':o.r>=3?'rgba(255,236,150,.9)':null;
  return{pose,kf,glow}}
const HP_BB={};
function hpBox(src){const k=src.src||src;if(HP_BB[k])return HP_BB[k];const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;let r=[0,0,w,h];
  try{const c=mkCv(w,h),x=c.getContext('2d');x.drawImage(src,0,0);const d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
    for(let y=0;y<h;y+=2)for(let i=0;i<w;i+=2)if(d[(y*w+i)*4+3]>24){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}
    if(x1>x0&&y1>y0)r=[x0,y0,Math.min(w,x1+2)-x0,Math.min(h,y1+2)-y0]}catch(e){}
  return typeof k==='string'?(HP_BB[k]=r):r}
function hpLoad(u){return new Promise((ok,no)=>{const im=new Image();im.decoding='async';im.onload=()=>ok(im);im.onerror=no;im.src=u})}
function hpFish(sp,variant){return new Promise(ok=>{let n=0;const t=()=>{const s=fishSrc(sp,variant);if(s)return ok(s);if(++n>60)return ok(null);setTimeout(t,50)};t()})}
function holdPose(hero,k,o){const sp=o&&spInfo(o.id),P=holdPick(o||{},sp),nm=P.pose+'_'+k,m=HOLD_M[nm];
  const fb=()=>{HERO_CX=.66;HERO_SC=.64;const im=new Image();im.className='cPose';im.alt='';im.src=poseURL(k);hero.appendChild(im)};
  if(!m||!sp){fb();return}
  const cv=document.createElement('canvas');cv.className='cPose hp '+P.pose;cv.style.opacity='0';hero.appendChild(cv);
  const B=OWN+'pov/hp_'+nm;
  Promise.all([hpLoad(B+'_b.webp'+POV_V),hpLoad(B+'_f.webp'+POV_V),hpFish(sp,o.variant)]).then(([b,f,src])=>{
    if(!src)throw 0;const [w,cx0,cy0,ang,span,len,th]=m,H=740,bb=hpBox(src),asp=bb[3]/bb[2];
    let L=(P.pose==='hold'?span:len)*P.kf;const cap=(P.pose==='hold'?.27:.42)*H;if(L*asp>cap)L=cap/asp;const fh=L*asp;
    const a=ang*Math.PI/180,ux=Math.cos(a),uy=Math.sin(a),nx=uy,ny=-ux;let cx=cx0,cy=cy0;
    if(P.pose==='lift'){const d=fh/2-th/2-.3*fh;cx+=nx*d;cy+=ny*d}
    /* 外框：身體圖 ∪ 旋轉後的魚 ∪ 光暈 */
    const g=P.glow?26:0,ex=(Math.abs(ux)*L+Math.abs(uy)*fh)/2+g,ey=(Math.abs(uy)*L+Math.abs(ux)*fh)/2+g;
    const X0=Math.floor(Math.min(0,cx-ex)),Y0=Math.floor(Math.min(0,cy-ey)),X1=Math.ceil(Math.max(b.naturalWidth,cx+ex)),Y1=Math.ceil(Math.max(H,cy+ey));
    const sc=Math.min(1,(hero.clientHeight||250)*2.2/(Y1-Y0));cv.width=Math.round((X1-X0)*sc);cv.height=Math.round((Y1-Y0)*sc);
    const x=cv.getContext('2d');x.scale(sc,sc);x.translate(-X0,-Y0);x.imageSmoothingQuality='high';
    x.drawImage(b,0,0,b.naturalWidth,H);
    const drawF=()=>{x.save();x.translate(cx,cy);x.rotate(a);x.drawImage(src,bb[0],bb[1],bb[2],bb[3],-L/2,-fh/2,L,fh);x.restore()};
    if(P.glow){x.save();x.shadowColor=P.glow;x.shadowBlur=g*sc*1.2;drawF();drawF();x.restore()}
    drawF();x.drawImage(f,0,0,f.naturalWidth,H);
    cv.style.aspectRatio=cv.width+'/'+cv.height;cv.style.opacity='';cv.classList.add('ok')
  }).catch(()=>{cv.remove();fb()})}

      if(G.st==='wait'&&G.wait){const w=G.wait,base=rnd(1.2,2.6)*(o.wait||1);w.bite=w.t+base+o.nib*.9;w.nibs=[...Array(o.nib)].map((_,i)=>w.t+base*.35+i*rnd(.65,.95)).filter(t=>t<w.bite-.5)}};
    api('POST','/cast',{spot,perfect:!!perfect,key:key()}).then(d=>{take(d.castId,d.outcome);api('GET','/status').then(apply).catch(()=>{})})
      .catch(async e=>{if(e.code==='cast_pending'){try{const st=await api('GET','/status');apply(st);if(st.pending){take(st.pending.castId,st.pending.outcome);return}}catch(x){}}
        if(G.out===o){G.out=null;endCast()}if(e.code==='no_casts'){L.refresh().catch(()=>{}).then(openBuyCasts)}else toast('⚠️ '+errMsg(e))});
    return o};
  const _upd=update;update=function(dt){if(G.st==='wait'&&G.wait&&G.out&&G.out._pending)G.wait.t=Math.min(G.wait.t,.3);_upd(dt)};
  const _end=endCast;endCast=function(){const id=G.castId;G.castId=null;if(id)api('POST','/resolve',{castId:id,result:'lost',key:key()}).then(r=>apply(r.status)).catch(()=>{});_end()};

  /* 魚獲卡：選擇放到哪裡（伺服器決定實際去處） */
  const DEST={tank:'目前的魚缸',storage:'收藏庫',sell:'賣掉換金幣'};
  const reasonTxt={tank_full:'魚缸空間不足',habitat_missing:'魚缸缺少需要的設備',tank_too_small:'魚缸等級不夠',storage_full:'收藏庫已滿',species_not_in_game:'遊戲還沒加入這種魚，已自動換成金幣',slot_locked:'該魚缸尚未解鎖'};
  async function resolveCatch(cid,dest,btns){if(L.busy)return;L.busy=true;btns.forEach(b=>b.disabled=true);
    try{const r=await api('POST','/resolve',{castId:cid,result:'caught',dest,key:key()});apply(r.status);sync();
      const why=r.reason?String(r.reason).split(',').map(x=>reasonTxt[x]||x).join('、'):'';
      if(dest==='release')toast('放生了，魚兒游回水裡 🌊');
      else if(r.dest==='sell'){SFX.coin();toast(`🪙 +${fmt(r.coins)}${why?'<br><small>'+E(why)+'</small>':''}`)}
      else{const tn=/^slot:/.test(r.dest)?((L.tanks||[]).find(t=>'slot:'+t.slot===r.dest)||{}).name||'魚缸':DEST[r.dest]||r.dest;toast(`🐠 已放進 <b>${E(tn)}</b>${why?'<br><small>'+E(why)+'</small>':''}`)}
      if(r.dbl){const d=r.dbl,s2=spInfo(d.id)||{name:d.id},w2=d.reason?String(d.reason).split(',').map(x=>reasonTxt[x]||x).join('、'):'';setTimeout(()=>toast(`🫧 雙魚：${E(s2.name)} ${d.dest==='sell'?'🪙 +'+fmt(d.coins||0):'→ '+E(/^slot:/.test(d.dest)?'魚缸 '+d.dest.slice(5):DEST[d.dest]||d.dest)}${w2?'<br><small>'+E(w2)+'</small>':''}`),1100)}
      closeCard()}
    catch(e){toast('⚠️ '+errMsg(e));if(['too_fast','cast_expired','cast_done','cast'].includes(e.code))closeCard();else btns.forEach(b=>b.disabled=false)}
    finally{L.busy=false}}
  const _show=showCatch;showCatch=function(){const o=G.land&&G.land.o,cid=G.castId;G.castId=null;_show();
    if(!o)return;const acts=$('#cardBox .acts');
    L.last=o;if(o.kind!=='fish'){const ps=$('#cardBox .inner').querySelectorAll('p'),pr=ps[ps.length-1];if(pr)pr.innerHTML='…';const bt=acts&&acts.querySelector('button');if(bt)bt.disabled=true;
      api('POST','/resolve',{castId:cid,result:'caught',key:key()}).then(r=>{apply(r.status);sync();if(pr)pr.innerHTML=r.gems?'💎 +'+r.gems:'🪙 +'+fmt(r.coins||0);if(bt)bt.disabled=false})
        .catch(e=>{if(pr)pr.innerHTML='⚠️ '+E(errMsg(e));if(bt)bt.disabled=false});return}
    const rec=$('#cardBox .rec');if(rec)rec.innerHTML=rec.innerHTML.replace(/（💎\+\d+）/,'');
    const val=sellPrice(Object.assign({},o,{keep:1}),1);{const vb=$('#cardBox .stats div:nth-child(3) b');if(vb)vb.innerHTML='🪙'+fmt(val)}L.last=o;
    /* 🧺 一律先放進魚簍（伺服器記錄魚獲、XP、大賽積分；魚存在伺服器的魚簍，回家時再結算） */
    const bk=key();basketCard(o,async()=>{try{const r=await api('POST','/resolve',{castId:cid,result:'caught',dest:'basket',key:bk});apply(r.status);sync();
        if(r.dest!=='basket'){const why=r.reason?String(r.reason).split(',').map(x=>reasonTxt[x]||x).join('、'):'';toast(`🐠 魚簍滿了，直接放進${r.dest==='sell'?'金幣 🪙+'+fmt(r.coins||0):DEST[r.dest]||'魚缸'}${why?'<br><small>'+E(why)+'</small>':''}`)}
        else toast(`🧺 ${E((spInfo(o.id)||{}).name||'')} 放進魚簍了`);
        if(r.dbl){const s2=spInfo(r.dbl.id)||{name:r.dbl.id};setTimeout(()=>toast(`🫧 雙魚：${E(s2.name)} 也進魚簍了`),1100)}}
      catch(e){if(['too_fast','cast_expired','cast_done','cast'].includes(e.code)){toast('⚠️ '+errMsg(e));L.refresh().catch(()=>{});return}throw e}})};
  /* 🧺 魚簍結算（伺服器）：放回魚缸／放生／收藏庫／賣掉；放進目前魚缸的魚會通知主遊戲標示「🎣 新」 */
  BK.settle=async items=>{const r=await api('POST','/basket/settle',{items:items.map(x=>({id:x.uid,dest:x.dest})),key:key()});apply(r.status);
    const nf=r.results.filter(x=>x.dest==='tank'&&x.fish).map(x=>({id:x.fish.id,sp:x.fish.sp,name:x.fish.name,cm:x.fish.caught&&x.fish.caught.cm}));
    try{parent!==window&&parent.postMessage({type:'fishing:sync',newFish:nf},location.origin)}catch(e){}
    return r.results.filter(x=>!x.error).map(x=>({uid:x.id,dest:x.dest==='sell'?'sell':x.dest==='release'?'release':x.dest==='storage'?'storage':'tank',coins:x.coins,why:x.reason&&x.want!==x.dest?String(x.reason).split(',').map(y=>reasonTxt[y]||y).join('、'):''}))};
  BK.put=async()=>{};

  /* 成就、每日任務、魚簍、機器人大賽：正式版不在客戶端發獎 */
  checkAch=function(){for(const a of ACH){if(S.ach[a.id])continue;if(a.f(S)>=a.goal){S.ach[a.id]=Date.now();setTimeout(()=>{toast(`🏆 成就達成：<b>${a.n}</b>`);SFX.win(1)},1800)}}save()};
  misEvent=function(){};
  /* 釣手角色：購買與選擇都由伺服器驗證（金幣扣魚缸存檔、鑽石走帳本） */
  charBuy=async function(id){try{const r=await api('POST','/buy',{kind:'char',id,key:key()});apply(r.status);sync();return true}catch(e){SFX.lose();toast('⚠️ '+errMsg(e));return false}};
  charSelect=async function(id){try{const r=await api('POST','/equip',{slot:'char',id});S.chars=Object.assign({},r.profile.chars||S.chars);S.char=r.profile.char||S.char;save();return true}catch(e){SFX.lose();toast('⚠️ '+errMsg(e));return false}};
  /* 💎重置次數：伺服器扣 gem_ledger；同一次操作沿用同一把 key（網路斷線重試不會重扣），按鈕按下就鎖住 */
  resetCasts=async function(){if(L.busy)return;L.busy=true;const b=$('#rstBtn');if(b){b.disabled=true;b.textContent='重置中…'}L.rk=L.rk||key();
    try{const r=await api('POST','/buy',{kind:'reset',key:L.rk});L.rk=null;apply(r.status);sync();SFX.coin();closeDlg();toast(`已重置！今天再釣 <b>${castsLeft()}</b> 次`);idleHint()}
    catch(e){if(e.status)L.rk=null;if(e.code==='casts_left'){L.refresh().catch(()=>{});closeDlg()}toast('⚠️ '+errMsg(e));if(b){b.disabled=false;b.textContent=`💎${CFG_F.resetGem} 重置為 ${boxMax()} 次`}}
    finally{L.busy=false}};
  $('#shB').addEventListener('click',async e=>{const t=e.target.closest('[data-buy],[data-unlock],[data-eq],[data-lrt],[data-act="reset"],[data-lclose]');if(!t)return;e.stopPropagation();e.preventDefault();if(L.busy)return;
    if(t.dataset.lrt){L.rt=t.dataset.lrt;renderSheet();return}
    if(t.dataset.lclose!==undefined){closeMode();return}
    if(t.dataset.act==='reset')return;
    L.busy=true;try{let r;
      if(t.dataset.buy){const[sl,id]=t.dataset.buy.split(':'),g=GEAR[sl].items[id];r=await api('POST','/buy',{kind:'gear',slot:sl,id,key:key()});apply(r.status);sync();SFX.coin();toast(`購買並裝備：<b>${E(g.name)}</b>`);if(g.cur==='gem')sparkle(W/2,H*.3,30,'#e6c2ff')}
      else if(t.dataset.unlock){const id=t.dataset.unlock;r=await api('POST','/buy',{kind:'spot',id,key:key()});apply(r.status);sync();SFX.win(1);toast('解鎖 '+SPOTS[id].name+'！')}
      else if(t.dataset.eq){const[sl,id]=t.dataset.eq.split(':');r=await api('POST','/equip',{slot:sl,id});S.eq=Object.assign({},S.eq,r.profile.eq);save();renderHud();renderSheet();SFX.ui()}
    }catch(err){SFX.lose();toast('⚠️ '+errMsg(err))}finally{L.busy=false}},true);

  /* 排行榜／真人大賽（伺服器） */
  const _rs2=renderSheet;renderSheet=function(){_rs2();if(curSheet==='set'){const a=$('#shB a[href="/"]');if(a){a.removeAttribute('href');a.setAttribute('data-lclose','');a.textContent='🐠 回到我的魚缸'}const rs=$('#shB [data-act="reset"]');if(rs)rs.remove();$('#shB').querySelectorAll('.note').forEach(n=>{if(/試玩版/.test(n.textContent))n.textContent='正式版 · 金幣、鑽石、釣具與魚獲都存在你的遊戲帳號。'})}
    if(curSheet!=='rank')return;const rt=L.rt||'tour';
    $('#shB').innerHTML=`<div class="tabs"><button data-lrt="tour" class="${rt==='tour'?'on':''}">🏆 釣魚大賽</button><button data-lrt="kg" class="${rt==='kg'?'on':''}">⚖️ 本週總重</button><button data-lrt="big" class="${rt==='big'?'on':''}">📏 本週最大</button></div><div id="lrB"><p class="note">載入中…</p></div>`;
    const row=(rk,n,v,me)=>`<div class="row ${me?'me':''}" style="${me?'background:rgba(255,211,106,.18);border-radius:10px':''}"><b style="width:34px">${rk<=3?['🥇','🥈','🥉'][rk-1]:rk}</b><span style="flex:1">${E(n)}</span><b>${v}</b></div>`;
    const kgTxt=v=>v<1?Math.round(v*1000)+' g':v.toFixed(2)+' kg';
    (rt==='tour'?api('GET','/tournament').then(d=>{const T=d.tournament,B=$('#lrB');if(!B)return;
        if(!T){B.innerHTML='<p class="note">目前沒有舉辦中的大賽，敬請期待！</p>';return}
        const tm=x=>new Date(x).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
        B.innerHTML=`<div class="row" style="flex-direction:column;align-items:flex-start"><b style="font-size:17px">${E(T.name)}</b><small>${T.live?'🔴 進行中':T.startAt>Date.now()?'⏳ 即將開始':'已結束'} · ${tm(T.startAt)} – ${tm(T.endAt)}${T.spot&&SPOTS[T.spot]?' · 限 '+E(SPOTS[T.spot].name):''}</small><small>獎勵：${T.rewards.map(r=>`第${r.from}${r.to>r.from?'–'+r.to:''}名 ${r.gems?'💎'+r.gems:''}${r.coins?' 🪙'+fmt(r.coins):''}`).join('、')||'—'}</small>${T.me?`<small>我的成績：第 <b>${T.me.rank}</b> 名 · ${fmt(T.me.score)} 分（${T.me.n} 條）</small>`:'<small>釣到魚就自動參賽，積分依稀有度、尺寸與變種計算</small>'}${T.myReward?`<small>🎁 已發獎：${T.myReward.gems?'💎'+T.myReward.gems:''} ${T.myReward.coins?'🪙'+fmt(T.myReward.coins):''}</small>`:''}</div>`+(T.top.map(r=>row(r.rank,r.name,fmt(r.score)+' 分',r.me)).join('')||'<p class="note">還沒有人上榜</p>')})
      :api('GET','/leaderboard?period=week&by='+rt).then(d=>{const B=$('#lrB');if(!B)return;B.innerHTML=`<p class="note">本週（週一 00:00 起，台灣時間）${rt==='kg'?'所有魚獲總重量':'單條最重'}排行</p>`+(d.rows.map(r=>row(r.rank,r.name,kgTxt(r.v)+` <small>${r.n}條</small>`,r.me)).join('')||'<p class="note">本週還沒有人上榜</p>')+(d.me&&!d.rows.some(r=>r.me)?`<p class="note">我的成績：${kgTxt(d.me.v)}（${d.me.n} 條）</p>`:'')})
    ).catch(e=>{const B=$('#lrB');if(B)B.innerHTML='<p class="note">⚠️ '+E(errMsg(e))+'</p>'})};

  /* 開啟：沒有登入／未開放時顯示提示 */
  document.body.classList.add('live');
  const css=document.createElement('style');css.textContent='body.live #boxChip,body.live #misChip{display:none!important}body.live .liveX{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:6px;z-index:60}';document.head.appendChild(css);
  {const b=$('#back');if(b){b.removeAttribute('href');b.title='回到我的魚缸';b.addEventListener('click',e=>{e.preventDefault();closeMode()})}const d=$('#demo');if(d)d.remove();document.title='悠游水族箱 · 釣魚'}
  const gate=(msg)=>{dlg(`<div style="font-size:44px">🎣</div><div class="nm" style="font-size:19px;font-weight:900">${msg}</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px"><button class="bt" onclick="FISH_LIVE.close()">🐠 回到我的魚缸</button></div>`)};
  if(!tok()){gate('請先從遊戲裡開啟釣魚模式');return}
  L.refresh().then(()=>{sync();if(S.basket&&S.basket.length&&G.st==='idle')openSettle('resume')}).catch(e=>{if(e.code==='fishing_disabled')gate('釣魚模式即將開放，敬請期待！');else if(e.status===401)gate('登入已過期，請回到遊戲重新整理');else gate(E(errMsg(e)))});
  addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.type==='fishing:refresh')L.refresh().catch(()=>{})});
})();

/* 🧪 測試頁專用（只在 /fishing-test/ 或 localhost 的單機版）：金幣／鑽石補滿，方便試買特殊釣竿與活動餌。
   不會出現在 ?mode=live，也不會打包進正式整合包（build.sh 的 live 版本不含這個檔案）。 */
if(!LIVE&&(/\/fishing-test\//.test(location.pathname)||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))(function(){
  const MIN_C=1000000,MIN_G=100000;
  function topUp(){let c=0;if(!(S.coins>=MIN_C)){S.coins=MIN_C;c=1}if(!(S.gems>=MIN_G)){S.gems=MIN_G;c=1}if(c){save();renderHud()}return c}
  window.FISH_TESTCASH=topUp;
  if(topUp())setTimeout(()=>toast('🧪 測試帳號：已補到 🪙1,000,000、💎100,000'),1200);
  const _rs=renderSheet;renderSheet=function(){_rs();if(curSheet!=='set')return;const box=$('#shB .bt[data-act="tut"]');if(!box)return;
    box.parentNode.insertAdjacentHTML('afterbegin','<button class="bt gem" data-tcash="1">🧪 測試：補滿金幣鑽石</button>')};
  $('#shB').addEventListener('click',e=>{if(!e.target.closest('[data-tcash]'))return;e.stopPropagation();const c0=S.coins,g0=S.gems;
    S.coins=Math.max(S.coins,MIN_C);S.gems=Math.max(S.gems,MIN_G);save();renderHud();SFX.coin();toast(S.coins>c0||S.gems>g0?'🧪 已補滿：🪙1,000,000、💎100,000':'🧪 已經很多了（🪙≥1M、💎≥100k）')},true);
})();

</script>
