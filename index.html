<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b2236">
<title>悠游水族箱 · 養魚小遊戲</title>
<style>
:root{--bg:#0b2236;--panel:#10314a;--card:#164463;--accent:#ffd166;--text:#eaf6ff;--muted:#8fb3c9;--pink:#ff7eb6;--ok:#5ee6a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
#app{display:flex;height:100%}
#tankWrap{position:relative;flex:1;min-width:0;overflow:hidden}
#tank{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#panel{width:340px;background:linear-gradient(#12395a,#0b2639);display:flex;flex-direction:column;border-left:1px solid #1f4c6d;min-height:0}
@media (max-width:820px){#app{flex-direction:column}#tankWrap{flex:none;height:58vh}#panel{width:100%;flex:1;border-left:none;border-top:1px solid #1f4c6d}}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:3}
.chip{background:rgba(4,22,38,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.chip b{color:var(--accent)}
#coinChip.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.15)}}
.spacer{flex:1}
.hbtn{pointer-events:auto;border:1px solid rgba(255,255,255,.2);background:linear-gradient(#ff8fc2,#e85d9b);color:#fff;font-weight:700;border-radius:999px;padding:7px 14px;font-size:14px;box-shadow:0 3px 12px rgba(232,93,155,.4)}
.hbtn.on{background:linear-gradient(#ffd166,#f0a020);box-shadow:0 3px 12px rgba(240,160,32,.5)}
#breedBar{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:rgba(232,93,155,.9);padding:8px 14px;border-radius:12px;font-size:14px;font-weight:600;display:none;z-index:3;gap:8px;align-items:center;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#breedBar button{border:none;border-radius:8px;padding:4px 10px;font-weight:700;background:#fff;color:#c2387a}
#breedBar button:disabled{opacity:.45}
#info{position:absolute;left:10px;top:54px;width:230px;background:rgba(6,26,44,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:12px;font-size:13px;display:none;z-index:4;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#info h3{margin:0 0 2px;font-size:17px;display:flex;align-items:center;gap:6px}
#info .sub{color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;margin:3px 0 7px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
#info .row{display:flex;justify-content:space-between}
#info .btns{display:flex;gap:6px;margin-top:8px}
#info .btns button{flex:1;border:none;border-radius:8px;padding:6px 0;font-weight:700;background:#245a80;color:#fff;font-size:12px}
#info .btns button.warn{background:#7a3a3a}
#info .x{position:absolute;right:8px;top:6px;background:none;border:none;color:var(--muted);font-size:18px}
.rar{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:700;border:1px solid currentColor}
.r0{color:#9fd3ff}.r1{color:#c79bff}.r2{color:#ffcf4d}
.tabs{display:flex;padding:10px 10px 0;gap:6px}
.tabs button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:15px;padding:10px 0;border-radius:10px 10px 0 0;border-bottom:3px solid transparent}
.tabs button.on{color:var(--text);background:rgba(255,255,255,.06);border-bottom-color:var(--accent)}
#tabContent{flex:1;overflow-y:auto;padding:10px;min-height:0;-webkit-overflow-scrolling:touch}
.sec{font-size:12px;color:var(--muted);margin:6px 2px 6px;letter-spacing:1px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:8px;border:1px solid rgba(255,255,255,.06)}
.item img{width:64px;height:40px;object-fit:contain;flex:none}
.item .ic{width:64px;height:40px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.item .txt{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .ds{font-size:12px;color:var(--muted);margin-top:2px}
.buy{border:none;border-radius:9px;padding:7px 10px;font-weight:800;background:linear-gradient(#ffd166,#f0a020);color:#4a2c00;font-size:13px;min-width:70px;flex:none}
.buy:disabled{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.buy.done{background:#2b6b55;color:#c9ffe8}
.book{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bk{background:var(--card);border-radius:12px;padding:8px;text-align:center;border:1px solid rgba(255,255,255,.06);position:relative}
.bk img{width:100%;height:58px;object-fit:contain}
.bk .nm{font-weight:700;font-size:14px;margin:2px 0}
.bk .ds{font-size:11px;color:var(--muted);min-height:28px}
.bk.lock .nm{color:#6c8aa0}
.bk .cnt{position:absolute;right:8px;top:6px;font-size:11px;color:var(--muted)}
.prog{font-size:13px;margin:4px 2px 10px;color:var(--muted)}
.prog b{color:var(--accent)}
.foot{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid #1f4c6d;font-size:12px;color:var(--muted);gap:8px}
.foot button{border:1px solid #7a3a3a;background:transparent;color:#ff9a9a;border-radius:8px;padding:5px 10px;font-size:12px}
#toasts{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5;width:90%}
.toast{background:rgba(6,26,44,.88);border:1px solid rgba(255,255,255,.15);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;animation:tin .3s ease-out;text-align:center;max-width:100%}
.toast.gold{border-color:#ffcf4d;color:#ffe9a8}.toast.pink{border-color:var(--pink)}.toast.bad{border-color:#ff6b6b;color:#ffc0c0}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
#modal{position:fixed;inset:0;background:rgba(0,10,20,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#modal .box{background:linear-gradient(#174a6e,#0e2e47);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:tin .3s}
#modal h2{margin:0 0 10px;font-size:20px}
#modal p{margin:6px 0;line-height:1.6;color:#cfe6f5}
#modal img{max-width:100%;height:90px;object-fit:contain}
#modal .mb{display:flex;gap:8px;justify-content:center;margin-top:14px}
#modal .mb button{border:none;border-radius:10px;padding:9px 18px;font-weight:800;background:linear-gradient(#ffd166,#f0a020);color:#4a2c00}
#modal .mb button.sec2{background:#2a587a;color:#fff}
</style>
</head>
<body>
<div id="app">
  <div id="tankWrap">
    <canvas id="tank"></canvas>
    <div id="hud">
      <div class="chip" id="coinChip">🪙 <b id="coinTxt">0</b></div>
      <div class="chip">🐟 <span id="fishTxt">0/6</span></div>
      <div class="chip" title="預估每分鐘收益">⏱ ≈<span id="rateTxt">0</span>/分</div>
      <div class="spacer"></div>
      <button class="hbtn" id="breedBtn">💕 繁殖</button>
    </div>
    <div id="breedBar"><span id="breedTxt">繁殖模式：請點選兩條成年魚（0/2）</span><button id="breedGo" disabled>配對</button><button id="breedCancel">取消</button></div>
    <div id="info"></div>
    <div id="toasts"></div>
  </div>
  <div id="panel">
    <div class="tabs"><button data-tab="shop" class="on">🐠 魚店</button><button data-tab="up">🛠 升級</button><button data-tab="book">📖 圖鑑</button></div>
    <div id="tabContent"></div>
    <div class="foot"><span>點擊水中投放飼料 · 點金幣收集</span><button id="resetBtn">重置進度</button></div>
  </div>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<script>
(()=>{
'use strict';
// ---------- 工具 ----------
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.floor(n).toLocaleString('zh-TW');
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let uidC=Date.now()%100000;const uid=()=>'f'+(uidC++).toString(36)+Math.floor(Math.random()*1e4).toString(36);

// ---------- 資料 ----------
const RARITY=['普通','稀有','傳說'];
const SPECIES={
 goldfish:{name:'金魚',r:0,price:15,coin:1,shape:'std',tail:'flow',len:30,ht:20,hue:28,sat:95,lit:56,speed:36,desc:'圓滾滾的經典觀賞魚，好養又親人。'},
 clown:{name:'小丑魚',r:0,price:35,coin:2,shape:'clown',tail:'fan',len:30,ht:17,hue:24,sat:100,lit:52,speed:44,desc:'橘白條紋的活潑小傢伙。'},
 neon:{name:'霓虹燈魚',r:0,price:60,coin:3,shape:'neon',tail:'fork',len:26,ht:10,hue:195,sat:25,lit:75,speed:58,desc:'身上閃著藍色霓虹光帶，游得飛快。'},
 tang:{name:'藍倒吊',r:0,price:100,coin:4,shape:'tang',tail:'fork',len:34,ht:24,hue:215,sat:85,lit:50,speed:48,tailColor:'hsl(50,100%,55%)',desc:'寶藍色身體配上黃色尾巴。'},
 angel:{name:'神仙魚',r:1,price:220,coin:8,shape:'angel',tail:'fan',len:28,ht:30,hue:48,sat:55,lit:80,speed:30,desc:'優雅的長鰭，宛如水中仙子。'},
 puffer:{name:'河豚',r:1,price:350,coin:11,shape:'puffer',tail:'small',len:28,ht:24,hue:52,sat:70,lit:64,speed:26,desc:'吃東西時會鼓起來，超級可愛。'},
 betta:{name:'鬥魚',r:1,price:0,sell:200,coin:14,shape:'betta',tail:'flow',len:28,ht:16,hue:340,sat:85,lit:50,speed:34,breedOnly:1,desc:'華麗飄逸的大尾鰭。繁殖時有機會突變出現。'},
 koi:{name:'錦鯉',r:2,price:0,sell:600,coin:22,shape:'koi',tail:'fan',len:42,ht:20,hue:10,sat:10,lit:95,speed:32,breedOnly:1,desc:'象徵好運的紅白錦鯉。只能透過繁殖突變獲得。'},
 dragon:{name:'金龍魚',r:2,price:0,sell:900,coin:30,shape:'arowana',tail:'fan',len:48,ht:16,hue:44,sat:90,lit:55,speed:38,breedOnly:1,desc:'金光閃閃的鱗片，帶來財運。只能透過繁殖突變獲得。'},
 rainbow:{name:'彩虹仙子',r:2,price:0,sell:1200,coin:40,shape:'rainbow',tail:'flow',len:30,ht:18,hue:0,sat:90,lit:62,speed:44,breedOnly:1,desc:'身上流轉七彩光芒的夢幻魚種。只能透過繁殖突變獲得。'},
};
const SP_KEYS=Object.keys(SPECIES);
const NAMES=['小花','阿福','泡泡','豆豆','咕嚕','小金','球球','米米','胖胖','波波','皮皮','糖糖','布丁','奶茶','麻糬','湯圓','珍珠','小橘','阿寶','嘟嘟','芝麻','可可','小星','雪球','旺財','圓圓','小雨','毛毛','樂樂','QQ'];
const STAGES=['幼魚','成魚','大魚'];
const G1=60,G2=160; // 成長門檻
const FOODS=[{n:'基本飼料',nutr:25,grow:6,col:'#c98a4b',cnt:1},{n:'營養飼料',nutr:35,grow:10,col:'#e0b04a',cnt:2},{n:'高級飼料',nutr:45,grow:15,col:'#e86a5a',cnt:2},{n:'頂級魚寶',nutr:60,grow:24,col:'#b07cff',cnt:3}];
const FOOD_COST=[80,300,900];
const CAP_COST=[100,250,600,1500,3500];
const FEEDER=[{n:'未安裝',iv:0},{n:'每 20 秒',iv:20},{n:'每 12 秒',iv:12},{n:'每 7 秒',iv:7}];
const FEEDER_COST=[150,400,1000];
const DECOS={
 coral:{n:'珊瑚叢',ic:'🪸',cost:200,bonus:.10,desc:'金幣收益 +10%'},
 wreck:{n:'沉船',ic:'⚓',cost:600,bonus:.20,desc:'金幣收益 +20%'},
 chest:{n:'海盜寶箱',ic:'💰',cost:1500,bonus:.30,desc:'金幣收益 +30%'},
 crystal:{n:'許願水晶',ic:'🔮',cost:1000,bonus:0,mut:.08,desc:'繁殖突變機率 +8%'},
};
const BREED_CD=90, OFFLINE_CAP=8*3600, OFFLINE_RATE=.5, SAVE_KEY='yuyou-aquarium-v1';
const HUNGER_RATE=.55;

// ---------- 狀態 ----------
let S;
function freshState(){return{coins:60,fish:[],up:{cap:0,food:0,feeder:0,deco:[]},found:{},last:Date.now(),tut:0}}
function load(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.fish))return Object.assign(freshState(),d)}}catch(e){}
  return null;
}
function save(){S.last=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify({coins:S.coins,fish:S.fish.map(serial),up:S.up,found:S.found,last:S.last,tut:S.tut}))}catch(e){}}
const KEEP=['id','sp','name','hue','size','growth','full','starve','sick','cd','coinT','seed'];
function serial(f){const o={};for(const k of KEEP)o[k]=f[k];return o}
const capacity=()=>6+S.up.cap*3;
const decoMult=()=>1+S.up.deco.reduce((a,k)=>a+(DECOS[k].bonus||0),0);
const stage=f=>f.growth>=G2?2:f.growth>=G1?1:0;
const fishScale=f=>1.8*(0.5+0.5*Math.min(1,f.growth/G2))*f.size;
const coinValue=f=>Math.max(1,Math.round(SPECIES[f.sp].coin*(stage(f)===2?2:1)*decoMult()));
function ratePerSec(){let r=0;for(const f of S.fish){const st=stage(f);if(st>0&&!f.sick)r+=coinValue(f)/(st===2?19:28)}return r}

function makeFish(sp,o={}){const s=SPECIES[sp];return Object.assign({id:uid(),sp,name:pick(NAMES),hue:(s.hue+rand(-8,8)+360)%360,size:rand(.92,1.08),growth:0,full:75,starve:0,sick:false,cd:0,coinT:rand(8,16),seed:Math.floor(Math.random()*1e5)},o)}
function addRuntime(f,x,y){f.x=x??rand(60,Math.max(80,W-60));f.y=y??rand(70,Math.max(90,floorY()-40));f.vx=rand(-10,10);f.vy=0;f.dir=Math.random()<.5?1:-1;f.face=f.dir;f.tx=f.x;f.ty=f.y;f.wT=0;f.phase=Math.random()*6;f.puff=0;f.chomp=0;return f}
function discover(sp){if(!S.found[sp]){S.found[sp]=1;return true}return false}

// ---------- 畫布 ----------
const cv=$('#tank'),ctx=cv.getContext('2d');
let W=800,H=500,DPR=1;const SAND=62;
const floorY=()=>H-SAND;
let plants=[],pebbles=[],rays=[];
function genScene(){
  const r=rng(1234);
  plants=[];const n=Math.max(4,Math.round(W/110));
  for(let i=0;i<n;i++){const x=(i+.5)/n*W+(r()-.5)*60;const blades=[];const bc=3+Math.floor(r()*3);
    for(let b=0;b<bc;b++)blades.push({dx:(r()-.5)*22,h:H*(.18+r()*.28),w:5+r()*4,ph:r()*6,hue:95+r()*50,l:28+r()*14});
    plants.push({x,blades,front:r()<.25})}
  pebbles=[];for(let i=0;i<W/9;i++)pebbles.push({x:r()*W,y:floorY()+12+r()*(SAND-16),rx:2+r()*6,ry:1.5+r()*3,c:`hsl(${30+r()*20},${20+r()*30}%,${45+r()*35}%)`});
  rays=[];for(let i=0;i<6;i++)rays.push({x:r()*W,w:40+r()*90,sp:.1+r()*.25,ph:r()*6});
}
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);W=Math.max(200,r.width);H=Math.max(200,r.height);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);genScene();
  if(S)for(const f of S.fish){f.x=clamp(f.x,20,W-20);f.y=clamp(f.y,50,floorY()-15);f.tx=f.x;f.ty=f.y}}

// ---------- 實體 ----------
let foods=[],coins=[],bubbles=[],parts=[],floats=[];
let T=0,bubbleT=0,feederT=0,saveT=0,uiT=0,chestOpen=0;
let selected=null,hover=null,breedMode=false,breedSel=[];

function dropFood(x,y,n){const lv=FOODS[S.up.food];n=n??lv.cnt;for(let i=0;i<n;i++){if(foods.length>=45)foods.shift();foods.push({x:clamp(x+rand(-14,14)*(n>1),10,W-10),y:Math.max(30,y+rand(-6,6)),vy:rand(18,26),life:25,lv:S.up.food,ph:Math.random()*6})}
  for(let i=0;i<3;i++)parts.push({x,y,vx:rand(-20,20),vy:rand(-30,-5),life:.6,max:.6,type:'ring',r:rand(2,4)})}
function dropCoin(x,y,v){coins.push({x,y,vy:12,v,t:0,ground:false,fly:0,ph:Math.random()*6})}
function collectCoin(c){if(c.fly)return;c.fly=1;c.sx=c.x;c.sy=c.y;c.ft=0}
function addCoins(v){S.coins+=v;const el=$('#coinChip');el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}

function updateFish(f,dt){
  const s=SPECIES[f.sp],st0=stage(f);
  f.full=Math.max(0,f.full-HUNGER_RATE*dt*(st0===0?.8:1));
  if(f.full<=0){f.starve+=dt;if(f.starve>50&&!f.sick){f.sick=true;toast(`🤒 ${f.name} 餓到生病了，快餵食！`,'bad')}if(f.starve>260){die(f);return}}
  else if(f.full>20){f.starve=0;if(f.sick){f.sick=false;toast(`😊 ${f.name} 恢復健康了！`)}}
  if(f.full>50&&!f.sick)f.growth+=.18*dt;
  f.cd=Math.max(0,f.cd-dt);
  if(stage(f)!==st0)grewUp(f);
  const st=stage(f);
  if(st>0&&!f.sick){f.coinT-=dt;if(f.coinT<=0){f.coinT=st===2?rand(16,22):rand(24,32);dropCoin(f.x,f.y+6,coinValue(f))}}
  // 目標
  let speed=s.speed*(f.sick?.45:1)*(.8+.2*f.size),tx,ty,seek=null;
  if(f.full<80&&foods.length){let bd=1e9;for(const fd of foods){const d=Math.hypot(fd.x-f.x,fd.y-f.y);if(d<bd&&d<(f.full<40?2000:320)){bd=d;seek=fd}}}
  if(seek){tx=seek.x;ty=seek.y;speed*=1.9}
  else{f.wT-=dt;if(f.wT<=0||Math.hypot(f.tx-f.x,f.ty-f.y)<18){f.tx=rand(40,W-40);f.ty=rand(60,floorY()-30);f.wT=rand(3,9);if(Math.random()<.3)speed*=.3}tx=f.tx;ty=f.ty}
  const dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy)||1;
  const slow=seek?1:clamp(d/80,.25,1);
  const k=seek?3:1.1;
  f.vx+=(dx/d*speed*slow-f.vx)*Math.min(1,k*dt);
  f.vy+=(dy/d*speed*slow*.65-f.vy)*Math.min(1,k*dt);
  f.x+=f.vx*dt;f.y+=f.vy*dt+Math.sin(T*1.2+f.seed)*4*dt;
  const sc=fishScale(f),half=s.len*sc*.5;
  f.x=clamp(f.x,half,W-half);f.y=clamp(f.y,40+s.ht*sc*.5,floorY()-s.ht*sc*.4);
  if(Math.abs(f.vx)>5)f.dir=Math.sign(f.vx);
  f.face+=(f.dir-f.face)*Math.min(1,5*dt);
  f.phase+=dt*(4+Math.hypot(f.vx,f.vy)*.16);
  f.puff=Math.max(0,f.puff-dt*.6);f.chomp=Math.max(0,f.chomp-dt*3);
  if(seek){const mx=f.x+f.dir*half*.8;if(Math.hypot(seek.x-mx,seek.y-f.y)<8+sc*6)eat(f,seek)}
}
function eat(f,fd){const lv=FOODS[fd.lv],st=stage(f);foods.splice(foods.indexOf(fd),1);f.full=Math.min(100,f.full+lv.nutr);f.growth+=lv.grow*(f.sick?.3:1);f.chomp=1;if(f.sp==='puffer')f.puff=1;
  if(f.full>20&&f.sick){f.sick=false;f.starve=0;toast(`😊 ${f.name} 恢復健康了！`)}
  for(let i=0;i<4;i++)parts.push({x:fd.x,y:fd.y,vx:rand(-25,25),vy:rand(-25,10),life:.5,max:.5,type:'crumb',c:lv.col,r:rand(1,2)});
  if(stage(f)!==st)grewUp(f)}
function grewUp(f){const st=stage(f);toast(`🎉 ${f.name} 長成${STAGES[st]}了！${st===1?'開始會掉金幣囉':'金幣產量加倍！'}`,'gold');for(let i=0;i<14;i++)parts.push({x:f.x,y:f.y,vx:rand(-60,60),vy:rand(-60,40),life:1,max:1,type:'star',r:rand(2,4)})}
function die(f){S.fish.splice(S.fish.indexOf(f),1);if(selected===f)closeInfo();toast(`💧 ${f.name} 離開了…記得定時餵食喔`,'bad');save()}

function update(dt){
  T+=dt;
  for(const f of S.fish.slice())updateFish(f,dt);
  for(let i=foods.length-1;i>=0;i--){const fd=foods[i];if(fd.y<floorY()+4){fd.y+=fd.vy*dt;fd.x+=Math.sin(T*2+fd.ph)*8*dt}else{fd.life-=dt;if(fd.life<=0)foods.splice(i,1)}}
  for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.t+=dt;
    if(c.fly){c.ft+=dt*1.6;const p=Math.min(1,c.ft),e=p*p*(3-2*p);c.x=c.sx+(36-c.sx)*e;c.y=c.sy+(24-c.sy)*e-Math.sin(p*Math.PI)*60;if(p>=1){addCoins(c.v);coins.splice(i,1)}continue}
    if(c.y<floorY()+8){c.y+=c.vy*dt;c.x+=Math.sin(T*1.5+c.ph)*6*dt}else c.ground=true;
    if(c.t>30)collectCoin(c)}
  bubbleT-=dt;if(bubbleT<=0){bubbleT=rand(.12,.3);const bx=W*.1+(S.up.deco.includes('chest')?0:0);bubbles.push({x:bx+rand(-4,4),y:floorY()+4,r:rand(1.5,4.5),vy:rand(35,60),ph:Math.random()*6});
    if(Math.random()<.25)bubbles.push({x:rand(0,W),y:floorY(),r:rand(1,3),vy:rand(20,40),ph:Math.random()*6});}
  if(S.up.deco.includes('chest')){chestOpen+=dt;if(chestOpen>8){chestOpen=0}if(chestOpen>6&&Math.random()<.4)bubbles.push({x:W*.62+rand(-8,8),y:floorY()-4,r:rand(1.5,3.5),vy:rand(30,50),ph:Math.random()*6,gold:1})}
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.y-=b.vy*dt;b.x+=Math.sin(T*3+b.ph)*10*dt;if(b.y<-10)bubbles.splice(i,1)}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.type==='heart'?-10:30)*dt;if(p.life<=0)parts.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){const p=floats[i];p.life-=dt;p.y-=25*dt;if(p.life<=0)floats.splice(i,1)}
  // 自動餵食器
  const fv=FEEDER[S.up.feeder].iv;if(fv){feederT+=dt;if(feederT>=fv){feederT=0;const hungry=S.fish.filter(f=>f.full<55).sort((a,b)=>a.full-b.full);if(hungry.length){const t=hungry[0];dropFood(clamp(t.x,20,W-20),46,Math.min(3,1+Math.floor(hungry.length/3)))}}}
  saveT+=dt;if(saveT>5){saveT=0;save()}
}

// ---------- 繪製：魚 ----------
function colors(f,s){let h=f.hue;if(s.shape==='rainbow')h=(f.hue+T*50)%360;const l=s.lit;
  return{h,main:`hsl(${h},${s.sat}%,${l}%)`,dark:`hsl(${h},${s.sat}%,${Math.max(8,l-20)}%)`,light:`hsl(${h},${s.sat}%,${Math.min(95,l+20)}%)`,fin:s.tailColor||`hsla(${h},${s.sat}%,${Math.min(90,l+6)}%,.85)`}}
function bodyPath(c,s,L,Hh,puff){c.beginPath();const n=L*.5,t=-L*.44;
  if(s.shape==='puffer'){c.ellipse(0,0,L*.46*(1+puff*.25),Hh*.5*(1+puff*.45),0,0,Math.PI*2)}
  else if(s.shape==='angel'){c.moveTo(n,0);c.quadraticCurveTo(L*.32,-Hh*.5,-L*.05,-Hh*.5);c.quadraticCurveTo(-L*.34,-Hh*.3,t,0);c.quadraticCurveTo(-L*.34,Hh*.3,-L*.05,Hh*.5);c.quadraticCurveTo(L*.32,Hh*.5,n,0)}
  else{c.moveTo(n,0);c.bezierCurveTo(n*.85,-Hh*.62,-L*.22,-Hh*.56,t,-Hh*.07);c.lineTo(t,Hh*.07);c.bezierCurveTo(-L*.22,Hh*.56,n*.85,Hh*.62,n,0)}
  c.closePath()}
function drawFish(c,f,opt={}){
  const s=SPECIES[f.sp],L=s.len,Hh=s.ht,col=colors(f,s),ph=f.phase||0,wig=Math.sin(ph);
  const sil=opt.sil;const fill=x=>sil?'#06192a':x;
  // 尾巴
  c.save();c.translate(-L*.4,0);c.rotate(wig*(s.tail==='flow'?.4:.3));c.fillStyle=fill(col.fin);c.beginPath();
  if(s.tail==='fan'){c.moveTo(4,0);c.quadraticCurveTo(-L*.12,-Hh*.2,-L*.34,-Hh*.52);c.quadraticCurveTo(-L*.24,0,-L*.34,Hh*.52);c.quadraticCurveTo(-L*.12,Hh*.2,4,0)}
  else if(s.tail==='fork'){c.moveTo(4,0);c.lineTo(-L*.32,-Hh*.5);c.lineTo(-L*.2,0);c.lineTo(-L*.32,Hh*.5);c.closePath()}
  else if(s.tail==='small'){c.moveTo(3,0);c.quadraticCurveTo(-L*.14,-Hh*.36,-L*.22,-Hh*.3);c.lineTo(-L*.16,0);c.lineTo(-L*.22,Hh*.3);c.quadraticCurveTo(-L*.14,Hh*.36,3,0)}
  else{const big=s.shape==='betta'?1.5:1;c.moveTo(4,0);c.bezierCurveTo(-L*.25,-Hh*.9*big,-L*.7*big,-Hh*.75*big+wig*6,-L*.62*big,wig*6);c.bezierCurveTo(-L*.7*big,Hh*.75*big+wig*6,-L*.25,Hh*.9*big,4,0)}
  c.fill();
  if(!sil&&(s.tail==='flow')){c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=.8;for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-L*.3,i*Hh*.2,-L*.55*(s.shape==='betta'?1.4:1),i*Hh*.32+wig*5);c.stroke()}}
  c.restore();
  // 背鰭 / 腹鰭
  c.fillStyle=fill(s.tailColor?col.dark:col.fin);c.beginPath();
  if(s.shape==='angel'){c.moveTo(L*.12,-Hh*.4);c.quadraticCurveTo(-L*.15,-Hh*1.15,-L*.34,-Hh*1.1+wig*2);c.lineTo(-L*.28,-Hh*.25);c.closePath();c.moveTo(L*.12,Hh*.4);c.quadraticCurveTo(-L*.15,Hh*1.15,-L*.34,Hh*1.1+wig*2);c.lineTo(-L*.28,Hh*.25);c.closePath()}
  else if(s.shape==='betta'){c.moveTo(L*.15,-Hh*.4);c.bezierCurveTo(-L*.1,-Hh*1.6,-L*.5,-Hh*1.3+wig*4,-L*.4,-Hh*.2);c.closePath();c.moveTo(L*.15,Hh*.4);c.bezierCurveTo(-L*.05,Hh*1.6,-L*.5,Hh*1.4+wig*4,-L*.4,Hh*.2);c.closePath()}
  else if(s.shape==='puffer'){c.moveTo(-L*.1,-Hh*.45);c.quadraticCurveTo(-L*.2,-Hh*.75,-L*.32,-Hh*.4);c.closePath()}
  else{c.moveTo(L*.16,-Hh*.4);c.quadraticCurveTo(-L*.02,-Hh*.9+wig,-L*.27,-Hh*.32);c.closePath();c.moveTo(-L*.05,Hh*.38);c.quadraticCurveTo(-L*.15,Hh*.68,-L*.28,Hh*.3);c.closePath()}
  c.fill();
  // 身體
  bodyPath(c,s,L,Hh,f.puff||0);
  if(sil){c.fillStyle='#06192a';c.fill();c.strokeStyle='rgba(140,180,210,.35)';c.lineWidth=1;c.stroke();return}
  const g=c.createLinearGradient(0,-Hh*.5,0,Hh*.5);g.addColorStop(0,col.dark);g.addColorStop(.45,col.main);g.addColorStop(1,col.light);c.fillStyle=g;c.fill();
  c.save();bodyPath(c,s,L,Hh,f.puff||0);c.clip();pattern(c,f,s,L,Hh,col);c.restore();
  // 胸鰭
  c.save();c.translate(L*.05,Hh*.12);c.rotate(.5+Math.sin(ph*1.6)*.35);c.fillStyle=s.tailColor?'rgba(255,255,255,.35)':`hsla(${col.h},${s.sat}%,${Math.min(92,s.lit+15)}%,.7)`;c.beginPath();c.ellipse(-L*.08,0,L*.12,Hh*.09,0,0,Math.PI*2);c.fill();c.restore();
  // 眼睛
  const er=Math.max(2,Hh*.13*(s.shape==='neon'?1.5:1)),ex=L*(s.shape==='puffer'?.22:.29),ey=-Hh*.08;
  c.fillStyle='#fff';c.beginPath();c.arc(ex,ey,er,0,Math.PI*2);c.fill();
  if(f.sick){c.strokeStyle='#223';c.lineWidth=1.2;c.beginPath();c.moveTo(ex-er*.6,ey-er*.6);c.lineTo(ex+er*.6,ey+er*.6);c.moveTo(ex+er*.6,ey-er*.6);c.lineTo(ex-er*.6,ey+er*.6);c.stroke()}
  else{c.fillStyle='#0b1420';c.beginPath();c.arc(ex+er*.2,ey,er*.62,0,Math.PI*2);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(ex+er*.38,ey-er*.3,er*.22,0,Math.PI*2);c.fill()}
  // 嘴
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;c.beginPath();const mo=(f.chomp||0)*2;c.moveTo(L*.47,Hh*.04-mo);c.lineTo(L*.4,Hh*.08);c.lineTo(L*.47,Hh*.1+mo);c.stroke();
  if(s.shape==='arowana'){c.strokeStyle='hsl(45,80%,40%)';c.lineWidth=1.2;c.beginPath();c.moveTo(L*.46,Hh*.12);c.quadraticCurveTo(L*.56,Hh*.3,L*.6+wig*2,Hh*.45);c.moveTo(L*.44,Hh*.14);c.quadraticCurveTo(L*.52,Hh*.32,L*.54+wig*2,Hh*.5);c.stroke()}
  if(f.sick){bodyPath(c,s,L,Hh,0);c.fillStyle='rgba(120,200,90,.3)';c.fill()}
}
function pattern(c,f,s,L,Hh,col){
  switch(s.shape){
  case'clown':for(const x of[L*.26,-L*.02,-L*.3]){c.fillStyle='#1b1b22';c.fillRect(x-L*.07,-Hh,L*.14,Hh*2);c.fillStyle='#fff';c.fillRect(x-L*.05,-Hh,L*.1,Hh*2)}break;
  case'neon':c.fillStyle=`hsl(0,90%,55%)`;c.beginPath();c.moveTo(-L*.45,Hh*.02);c.lineTo(L*.05,Hh*.08);c.lineTo(L*.05,Hh*.6);c.lineTo(-L*.45,Hh*.6);c.fill();
    c.shadowColor=`hsl(${f.hue},100%,60%)`;c.shadowBlur=6;c.fillStyle=`hsl(${f.hue},100%,62%)`;c.fillRect(-L*.45,-Hh*.18,L*.85,Hh*.2);c.shadowBlur=0;break;
  case'tang':c.fillStyle='#0c1530';c.beginPath();c.moveTo(L*.3,-Hh*.12);c.quadraticCurveTo(0,-Hh*.5,-L*.4,-Hh*.25);c.quadraticCurveTo(-L*.1,-Hh*.05,-L*.1,Hh*.2);c.quadraticCurveTo(L*.1,-Hh*.1,L*.3,-Hh*.12);c.fill();break;
  case'angel':c.fillStyle='rgba(30,30,40,.55)';for(const x of[L*.18,-L*.06,-L*.28])c.fillRect(x-2,-Hh,4,Hh*2);break;
  case'puffer':{const r=rng(f.seed);c.fillStyle=`hsl(${f.hue+10},60%,30%)`;for(let i=0;i<14;i++){const x=(r()-.5)*L*.8,y=(r()-.8)*Hh*.6;c.beginPath();c.arc(x,y,1.3+r()*1.6,0,7);c.fill()}c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.ellipse(0,Hh*.3,L*.35,Hh*.25,0,0,7);c.fill();break}
  case'koi':{const r=rng(f.seed);c.fillStyle=`hsl(${f.hue},90%,50%)`;for(let i=0;i<4;i++){c.beginPath();c.ellipse((r()-.5)*L*.8,(r()-.7)*Hh*.5,L*(.08+r()*.1),Hh*(.15+r()*.15),r()*3,0,7);c.fill()}if(f.seed%3===0){c.fillStyle='#1a1a1a';c.beginPath();c.arc(-L*.1,-Hh*.1,Hh*.1,0,7);c.fill()}break}
  case'arowana':c.strokeStyle=`hsla(${f.hue+10},100%,80%,.7)`;c.lineWidth=.8;for(let y=-Hh*.4;y<Hh*.5;y+=Hh*.22)for(let x=-L*.4;x<L*.35;x+=L*.09){c.beginPath();c.arc(x+(Math.round(y)%2?L*.045:0),y,L*.05,-1.2,1.2);c.stroke()}
    c.fillStyle=`rgba(255,255,220,${.25+.2*Math.sin(T*3+f.seed)})`;c.fillRect(-L*.5+((T*30+f.seed)%(L*1.4)),-Hh,6,Hh*2);break;
  case'rainbow':for(let i=0;i<6;i++){c.fillStyle=`hsla(${(f.hue+T*50+i*55)%360},90%,62%,.85)`;c.fillRect(-L*.5,-Hh*.5+i*Hh/6,L,Hh/6+.5)}
    c.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<3;i++){const a=T*2+i*2.1+f.seed;c.beginPath();c.arc(Math.sin(a)*L*.3,Math.cos(a*1.3)*Hh*.25,1.2,0,7);c.fill()}break;
  case'betta':c.fillStyle=`hsla(${f.hue+40},100%,70%,.3)`;c.beginPath();c.ellipse(0,-Hh*.1,L*.3,Hh*.18,0,0,7);c.fill();break;
  default:c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.ellipse(L*.05,Hh*.25,L*.3,Hh*.18,0,0,7);c.fill();
  }
  // 鱗光
  c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.ellipse(L*.1,-Hh*.25,L*.22,Hh*.08,-.1,0,7);c.fill();
}

function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5cc8ec');g.addColorStop(.35,'#2a95c4');g.addColorStop(.8,'#11577f');g.addColorStop(1,'#0b3b5c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    ctx.fillStyle='#ffd966';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.arc(i*7,-22-Math.abs(i)*-1+ (open>.05?-4:0),3.5,0,7);ctx.fill()}ctx.restore()}

    for(const[dx,h,w,a]of[[-12,34,9,-.25],[0,52,12,0],[13,30,8,.3]]){ctx.save();ctx.rotate(a);ctx.translate(dx,0);const g2=ctx.createLinearGradient(-w,0,w,0);g2.addColorStop(0,'#8a5cff');g2.addColorStop(.5,'#e4ccff');g2.addColorStop(1,'#6a3fd0');ctx.fillStyle=g2;ctx.beginPath();ctx.moveTo(-w,0);ctx.lineTo(-w,-h*.75);ctx.lineTo(0,-h);ctx.lineTo(w,-h*.75);ctx.lineTo(w,0);ctx.fill();ctx.restore()}ctx.restore()}
  // 氣泡石

}
function drawFeeder(){if(!S.up.feeder)return;const x=W*.72;ctx.fillStyle='#d8e6ee';ctx.fillRect(x-20,0,40,22);ctx.fillStyle='#8aa';ctx.fillRect(x-6,22,12,6);ctx.fillStyle='#ff6b6b';ctx.beginPath();ctx.arc(x+12,10,3,0,7);ctx.fill();ctx.fillStyle='#234';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('自動',x-4,14);
  const fv=FEEDER[S.up.feeder].iv;ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x-20,24+6,40,3);ctx.fillStyle='#5ee6a8';ctx.fillRect(x-20,24+6,40*Math.min(1,feederT/fv),3)}
function drawFood(fd){const lv=FOODS[fd.lv];ctx.fillStyle=lv.col;ctx.globalAlpha=fd.life<3?fd.life/3:1;ctx.beginPath();ctx.arc(fd.x,fd.y,3+fd.lv*.4,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.arc(fd.x-1,fd.y-1,1,0,7);ctx.fill();ctx.globalAlpha=1}
function drawCoin(c){const sp=Math.cos(T*4+c.ph);const big=c.v>=20,r=Math.min(13,7+Math.log2(c.v+1)*1.6);ctx.save();ctx.translate(c.x,c.y);
  if(!c.fly&&c.t>25)ctx.globalAlpha=.5+.5*Math.abs(Math.sin(T*8));
  if(big){ctx.scale(Math.abs(sp)*.5+.5,1);ctx.fillStyle='#6ff0ff';ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.8,-r*.2);ctx.lineTo(0,r);ctx.lineTo(-r*.8,-r*.2);ctx.closePath();ctx.fill();ctx.fillStyle='#d8ffff';ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.3,-r*.2);ctx.lineTo(-r*.3,-r*.2);ctx.fill()}
  else{ctx.scale(Math.max(.15,Math.abs(sp)),1);ctx.fillStyle='#c88a12';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(0,0,r*.8,0,7);ctx.fill();ctx.fillStyle='#c88a12';ctx.font=`bold ${r}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1)}
  ctx.restore();
  if(!c.fly&&Math.random()<.03)parts.push({x:c.x+rand(-8,8),y:c.y+rand(-8,8),vx:0,vy:-10,life:.5,max:.5,type:'star',r:1.5})}
function heart(x,y,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y+s*.3);ctx.bezierCurveTo(x,y,x-s*.5,y-s*.1,x-s*.5,y+s*.25);ctx.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.75,x,y+s);ctx.bezierCurveTo(x,y+s*.75,x+s*.5,y+s*.6,x+s*.5,y+s*.25);ctx.bezierCurveTo(x+s*.5,y-s*.1,x,y,x,y+s*.3);ctx.fill()}
function render(){

    ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.face*sc,sc);ctx.rotate(clamp(Math.atan2(f.vy,Math.abs(f.vx)+8)*.5,-.4,.4));drawFish(ctx,f);ctx.restore();

  if(hover&&hover!==selected){const s=SPECIES[hover.sp],sc=fishScale(hover);const txt=`${hover.name}・${s.name}`;ctx.font='bold 12px "Noto Sans TC",sans-serif';const w=ctx.measureText(txt).width+14,x=hover.x,y=hover.y-s.ht*sc*.7-22;ctx.fillStyle='rgba(5,25,40,.75)';ctx.beginPath();ctx.roundRect?ctx.roundRect(x-w/2,y-10,w,20,10):ctx.rect(x-w/2,y-10,w,20);ctx.fill();ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(txt,x,y+1);ctx.textBaseline='alphabetic'}

}

// ---------- 輸入 ----------
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function fishAt(x,y){let best=null,bd=1e9;for(const f of S.fish){const s=SPECIES[f.sp],sc=fishScale(f);const d=Math.hypot(f.x-x,(f.y-y)*1.3);const rad=Math.max(18,s.len*sc*.55);if(d<rad&&d<bd){bd=d;best=f}}return best}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const{x,y}=pos(e);
  // 金幣優先
  let hit=false;for(const c of coins){if(!c.fly&&Math.hypot(c.x-x,c.y-y)<24){collectCoin(c);floats.push({x:c.x,y:c.y-10,t:'+'+c.v,life:1});hit=true}}if(hit)return;
  const f=fishAt(x,y);
  if(breedMode){if(f)toggleBreed(f);return}
  if(f){selectFish(f);return}
  if(y<floorY()+4){dropFood(x,y);if(S.tut===0){S.tut=1}}
});
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const{x,y}=pos(e);hover=fishAt(x,y);cv.style.cursor=hover?'pointer':coins.some(c=>Math.hypot(c.x-x,c.y-y)<24)?'pointer':'crosshair'});
cv.addEventListener('pointerleave',()=>hover=null);

  <div class="row"><span>成長</span><span>${st===2?'已完全長大':`${Math.floor(gp)}% → ${STAGES[st+1]}`}</span></div><div class="bar"><i style="width:${gp}%;background:#7cc8ff"></i></div>
  <div class="row"><span>繁殖</span><span>${st===0?'尚未成年':f.cd>0?`冷卻 ${Math.ceil(f.cd)} 秒`:'可以繁殖 💕'}</span></div>

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
info.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||!selected)return;const f=selected;
  if(a.dataset.act==='close')closeInfo();

// ---------- 繁殖 ----------
function setBreed(on){breedMode=on;breedSel=[];$('#breedBtn').classList.toggle('on',on);$('#breedBtn').textContent=on?'💕 繁殖中':'💕 繁殖';$('#breedBar').style.display=on?'flex':'none';updBreedBar();if(on)closeInfo()}
function updBreedBar(){$('#breedTxt').textContent=`繁殖模式：請點選兩條成年魚（${breedSel.length}/2）`;$('#breedGo').disabled=breedSel.length<2}
function toggleBreed(f){const i=breedSel.indexOf(f);if(i>=0){breedSel.splice(i,1);updBreedBar();return}
  if(stage(f)===0){toast(`${f.name} 還是幼魚，長大才能繁殖`,'bad');return}
  if(f.cd>0){toast(`${f.name} 需要休息 ${Math.ceil(f.cd)} 秒`,'bad');return}
  if(f.sick){toast(`${f.name} 生病了，先餵飽牠吧`,'bad');return}
  if(breedSel.length>=2)breedSel.shift();breedSel.push(f);updBreedBar()}
function mixHue(a,b,t){let d=((b-a+540)%360)-180;return(a+d*t+360)%360}
function breed(a,b){
  if(S.fish.length>=capacity()){toast('魚缸滿了！先擴建魚缸或出售魚兒','bad');return}
  const ra=SPECIES[a.sp].r,rb=SPECIES[b.sp].r,maxR=Math.max(ra,rb);
  const mut=.1+maxR*.05+S.up.deco.reduce((s,k)=>s+(DECOS[k].mut||0),0);
  let sp,hue,mutated=false;
  if(Math.random()<mut){mutated=true;if(Math.random()<.25+maxR*.12)sp=pick(['koi','dragon','rainbow']);else sp='betta';hue=(SPECIES[sp].hue+rand(-12,12)+360)%360}
  else{sp=Math.random()<.5?a.sp:b.sp;hue=(mixHue(a.hue,b.hue,rand(.3,.7))+rand(-14,14)+360)%360}
  const child=makeFish(sp,{hue,size:clamp((a.size+b.size)/2+rand(-.07,.07),.8,1.25),full:85});
  addRuntime(child,(a.x+b.x)/2,(a.y+b.y)/2);S.fish.push(child);a.cd=b.cd=BREED_CD;
  for(let i=0;i<16;i++)parts.push({x:child.x,y:child.y,vx:rand(-50,50),vy:rand(-60,0),life:1.4,max:1.4,type:'heart',r:rand(2,4)});
  const isNew=discover(sp);const s=SPECIES[sp];
  if(isNew||mutated){showModal(`<h2>${mutated?'✨ 突變誕生！':'🐣 新生命誕生！'}</h2><img src="${preview(sp,hue)}"><p><b>${esc(child.name)}</b>（${s.name}）<span class="rar r${s.r}">${RARITY[s.r]}</span></p>${isNew?'<p>📖 圖鑑新增了一個品種！</p>':''}<p style="font-size:13px">父母：${esc(a.name)} × ${esc(b.name)}</p>`,[['太棒了！']])}
  else toast(`🐣 ${a.name} 和 ${b.name} 生下了 ${child.name}（${s.name}）`,'pink');
  setBreed(false);save();refreshUI(true)}
$('#breedBtn').onclick=()=>setBreed(!breedMode);
$('#breedCancel').onclick=()=>setBreed(false);
$('#breedGo').onclick=()=>{if(breedSel.length===2)breed(breedSel[0],breedSel[1])};

const prevCache={};
function preview(sp,hue,sil){const key=sp+'|'+Math.round(hue??-1)+'|'+(sil?1:0);if(prevCache[key])return prevCache[key];const s=SPECIES[sp];const c=document.createElement('canvas');c.width=160;c.height=100;const x=c.getContext('2d');
  const f={sp,hue:hue??s.hue,phase:1.2,seed:7,full:100,puff:0,chomp:0};const sc=Math.min(120/(s.len*(s.tail==='flow'?1.9:1.5)),70/(s.ht*(s.shape==='angel'||s.shape==='betta'?2.5:1.3)));
  x.translate(80+(s.tail==='flow'?12:6)*sc/2,50);x.scale(sc,sc);drawFish(x,f,{sil});return prevCache[key]=c.toDataURL()}

$('#tabContent').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.buy){const k=b.dataset.buy,s=SPECIES[k];if(S.coins<s.price||S.fish.length>=capacity())return;S.coins-=s.price;const f=addRuntime(makeFish(k),rand(60,W-60),50);S.fish.push(f);const n=discover(k);toast(`🐟 歡迎新成員 ${f.name}（${s.name}）${n?'・圖鑑更新！':''}`)}
  else if(b.dataset.up){const k=b.dataset.up,lv=S.up[k],cost=k==='cap'?CAP_COST[lv]:k==='food'?FOOD_COST[lv]:FEEDER_COST[lv];if(cost==null||S.coins<cost)return;S.coins-=cost;S.up[k]++;toast(k==='cap'?`🏠 魚缸擴建完成！容量 ${capacity()}`:k==='food'?`🍤 飼料升級為「${FOODS[S.up.food].n}」`:`⚙️ 自動餵食器：${FEEDER[S.up.feeder].n}`,'gold')}
  else if(b.dataset.deco){const k=b.dataset.deco,d=DECOS[k];if(S.coins<d.cost||S.up.deco.includes(k))return;S.coins-=d.cost;S.up.deco.push(k);toast(`${d.ic} 放置了「${d.n}」！${d.desc}`,'gold')}
  save();refreshUI(true)});

// ---------- 提示與對話框 ----------
function toast(t,cls=''){const el=document.createElement('div');el.className='toast '+cls;el.textContent=t;const box=$('#toasts');box.appendChild(el);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>{el.style.transition='opacity .4s';el.style.opacity=0;setTimeout(()=>el.remove(),400)},2800)}
function showModal(html,btns){const box=$('#modalBox');box.innerHTML=html+'<div class="mb"></div>';const mb=box.querySelector('.mb');for(const[t,fn,cls]of btns){const b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=()=>{$('#modal').style.display='none';fn&&fn()};mb.appendChild(b)}$('#modal').style.display='flex'}
function confirmModal(title,msg,fn){showModal(`<h2>${title}</h2><p>${msg}</p>`,[['取消',null,'sec2'],['確定',fn]])}
$('#resetBtn').onclick=()=>confirmModal('重置進度','所有魚兒、金幣、升級與圖鑑都會清除，確定要重新開始嗎？',()=>{localStorage.removeItem(SAVE_KEY);newGame();toast('🔄 已重新開始')});

// ---------- 離線收益 ----------
function offline(sec){if(sec<60)return;const el=Math.min(sec,OFFLINE_CAP);const earn=Math.floor(ratePerSec()*el*OFFLINE_RATE);if(earn<=0)return;
  const hh=Math.floor(el/3600),mm=Math.floor(el%3600/60);S.coins+=earn;
  showModal(`<h2>🌙 歡迎回來！</h2><p>你離開了 ${hh?hh+' 小時 ':''}${mm} 分鐘${sec>OFFLINE_CAP?'（上限 8 小時）':''}</p><p>魚兒們悠游自在，幫你存下了</p><p style="font-size:28px;font-weight:800;color:#ffd166">🪙 ${fmt(earn)}</p>`,[['收下']]);refreshUI(true)}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();save()}else if(hiddenAt){const s=(Date.now()-hiddenAt)/1000;hiddenAt=0;last=performance.now();offline(s)}});
window.addEventListener('pagehide',save);

// ---------- 啟動 ----------
function newGame(){S=freshState();foods=[];coins=[];closeInfo();setBreed(false);
  for(const k of['goldfish','goldfish','clown']){const f=addRuntime(makeFish(k));S.fish.push(f);discover(k)}
  S.fish[0].growth=G1+5;S.fish[1].growth=G1+5;save();refreshUI(true);
  setTimeout(()=>showModal('<h2>🐠 悠游水族箱</h2><p>點擊水中投放飼料，餵飽魚兒讓牠們長大。</p><p>成魚會掉落金幣 🪙，點擊收集或等牠自動入帳。</p><p>用金幣買新魚、升級魚缸，再選兩條成魚 💕 繁殖，收集稀有與傳說魚種吧！</p>',[['開始養魚']]),50)}
resize();
const saved=load();
if(saved){S=saved;S.fish.forEach(f=>{addRuntime(f);f.size=f.size||1});refreshUI(true);offline((Date.now()-(S.last||Date.now()))/1000)}else newGame();
window.addEventListener('resize',resize);
let last=performance.now(),speed=1;
function loop(now){const dt=Math.min(.05,(now-last)/1000)*speed;last=now;update(dt);render();uiT+=dt;if(uiT>.25){uiT=0;refreshUI();updateInfo()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// 測試用介面
window.__aquarium={get state(){return S},get foods(){return foods},get coins(){return coins},step(sec){for(let t=0;t<sec;t+=.05)update(.05);render();refreshUI(true)},dropFood,setSpeed(v){speed=v},breed,SPECIES};
})();
</script>
</body>
</html>
