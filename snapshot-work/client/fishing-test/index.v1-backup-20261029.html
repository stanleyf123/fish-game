<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b2236">
<meta name="robots" content="noindex">

<title>悠游水族箱 · 釣魚模式（試玩版）</title>
<style>
:root{--bg:#0b2236;--panel:#10314a;--card:#164463;--accent:#ffd166;--text:#eaf6ff;--muted:#8fb3c9;--pink:#ff7eb6;--ok:#5ee6a8;--bad:#ff6b6b;--line:rgba(160,220,255,.16);--glass:rgba(10,38,60,.72);--btn:#1d5a80;--btnt:#eaf6ff;--r0:#9fd3ff;--r1:#c79bff;--r2:#ffcf4d;--r3:#ff7eb6}
html[data-theme=light]{--panel:#FFF8EC;--card:#F3E2C8;--accent:#7a4b00;--text:#3e2a1c;--muted:#5a4630;--line:rgba(120,85,50,.28);--glass:rgba(255,248,236,.9);--btn:#a94f25;--btnt:#fff;--ok:#17673d;--bad:#b3261e;--pink:#c2255c;--r0:#1f6fa8;--r1:#7b3fc4;--r2:#9a6500;--r3:#c2185b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:0}
#cv{position:fixed;inset:0;width:100vw;height:100%;touch-action:none;display:block}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 6px) 8px 0;display:flex;gap:6px;align-items:center;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#spotChip{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}#spotChip b{overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:800;color:var(--text);white-space:nowrap}
.chip b{color:var(--accent)}
#back{width:34px;height:34px;border-radius:50%;justify-content:center;padding:0;font-size:16px;text-decoration:none}
#casts{margin-left:auto}
#casts .plus{margin-left:2px;background:var(--btn);color:var(--btnt);border-radius:999px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
#row2{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 46px);display:flex;gap:6px;align-items:center;z-index:5;pointer-events:none}
#row2>*{pointer-events:auto}
#demo{flex:none;white-space:nowrap;font-size:11px;font-weight:800;border-radius:8px;padding:3px 8px;color:var(--text);margin-left:auto}
#demo i{font-style:normal;color:var(--pink)}
#tourBar{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 78px);z-index:5;border-radius:12px;padding:6px 10px;font-size:12.5px;font-weight:800;display:none;align-items:center;gap:8px}
#tourBar .tb{flex:1;height:5px;border-radius:9px;background:rgba(128,128,128,.25);overflow:hidden}#tourBar .tb i{display:block;height:100%;background:var(--accent)}
#fight{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 112px);z-index:5;display:none;border-radius:14px;padding:8px 10px 9px}
#fight .top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;margin-bottom:5px}
#tens{position:relative;height:18px;border-radius:10px;overflow:hidden;background:linear-gradient(90deg,#5b6b78 0 8%,#2f9e6a 8% 30%,#3ad38a 30% 75%,#e9b23a 75% 90%,#e5484d 90%);opacity:.95}
html[data-theme=light] #tens{outline:1px solid rgba(62,42,28,.35)}
#tens .nd{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;border-radius:4px;background:#fff;box-shadow:0 0 0 2px #10314a,0 0 10px #fff}
#tens .lb{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 6px;font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
#stam{height:6px;border-radius:6px;background:rgba(128,128,128,.25);margin-top:6px;overflow:hidden}#stam i{display:block;height:100%;background:var(--pink);transition:width .1s}
#fight.danger{animation:shk .12s infinite}
@keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}
#hint{position:fixed;left:0;right:0;top:60%;text-align:center;z-index:4;pointer-events:none;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6),0 0 2px #000;padding:0 20px;transition:opacity .2s}
#hint small{display:block;font-size:12.5px;font-weight:700;opacity:.92;margin-top:3px}
#pop{position:fixed;left:0;right:0;top:36%;text-align:center;z-index:6;pointer-events:none;font-weight:900;font-size:30px;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.35);text-shadow:0 3px 10px rgba(0,0,0,.55);opacity:0}
#pop.go{animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#reelBtn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);width:112px;height:112px;margin-left:-56px;border-radius:50%;z-index:4;display:none;pointer-events:none;align-items:center;justify-content:center;flex-direction:column;font-weight:900;font-size:15px;color:#fff;background:radial-gradient(circle at 50% 40%,rgba(255,209,102,.55),rgba(255,140,40,.25) 60%,rgba(0,0,0,.1));border:3px solid rgba(255,255,255,.75);text-shadow:0 1px 3px #000}
#reelBtn.on{transform:scale(.92);background:radial-gradient(circle at 50% 40%,rgba(255,230,140,.9),rgba(255,140,40,.55) 60%,rgba(0,0,0,.1))}
#reelBtn small{font-size:11px;font-weight:700}
#sideBtns{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:5;display:flex;flex-direction:column;gap:8px}
.sbtn{border-radius:14px;padding:8px 12px;font-weight:900;font-size:13px;color:var(--text)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:6px;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);border-top:1px solid var(--line)}
#nav button{flex:1;min-height:54px;border-radius:12px;background:transparent;color:var(--text);font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#nav button .e{font-size:20px;line-height:1}
#nav button.hot{background:rgba(255,209,102,.18)}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:8;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:78%;z-index:9;border-radius:18px 18px 0 0;background:var(--panel);color:var(--text);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
html[data-theme=light] #sheet,html[data-theme=light] .modal .box{background:linear-gradient(180deg,#FFF8EC,#F3E2C8)}
#sheet.open{transform:none}
#sheet .hd{display:flex;align-items:center;padding:12px 14px 8px;font-weight:900;font-size:17px}
#sheet .hd .x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--card);color:var(--text);font-size:18px}
#sheet .bd{overflow:auto;padding:0 12px calc(env(safe-area-inset-bottom) + 16px);-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:6px;margin:2px 0 10px}.tabs button{flex:1;min-height:38px;border-radius:999px;background:var(--card);color:var(--text);font-weight:800;font-size:13px}.tabs button.on{background:var(--btn);color:var(--btnt)}
html[data-theme=dark] .tabs button.on{background:#ffd166;color:#06192a}
.it{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px;margin-bottom:8px;border:1px solid var(--line)}
.it .ic{width:52px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.it .ic img,.it .ic canvas{max-width:52px;max-height:40px}
.it .tx{flex:1;min-width:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.it .tx b{font-size:14.5px;color:var(--text)}
.it .tx .st{color:var(--text);font-weight:700}
.bt{border-radius:999px;padding:8px 12px;min-height:38px;font-weight:900;font-size:13px;background:var(--btn);color:var(--btnt);white-space:nowrap}
.bt.gem{background:linear-gradient(180deg,#7a5cff,#4b33c9);color:#fff}
.bt.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.bt[disabled]{opacity:.45}
.bt.eq{background:var(--ok);color:#06192a}
html[data-theme=light] .bt.eq{color:#fff}
.tag{display:inline-block;border-radius:6px;padding:0 5px;font-size:11px;font-weight:900;margin-left:4px;vertical-align:1px;border:1px solid currentColor}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}
.gold{color:#e0a800}.albino{color:#d9536f}
html[data-theme=dark] .gold{color:#ffd23f}html[data-theme=dark] .albino{color:#ffb3c4}
.note{font-size:12px;color:var(--muted);line-height:1.55;background:rgba(128,128,128,.1);border-radius:10px;padding:8px 10px;margin:6px 0 10px}
.demoT{color:var(--pink);font-weight:900}
.lb{width:100%;border-collapse:collapse;font-size:13px}.lb td{padding:7px 4px;border-bottom:1px solid var(--line)}.lb tr.me td{background:rgba(255,209,102,.18);font-weight:900}.lb td:first-child{width:34px;text-align:center;font-weight:900}.lb td:last-child{text-align:right;font-weight:800}
.spot{position:relative;border-radius:16px;padding:12px;margin-bottom:9px;color:#fff;min-height:84px;text-shadow:0 1px 3px rgba(0,0,0,.6);border:2px solid transparent}
.spot.on{border-color:#ffd166;box-shadow:0 0 0 2px rgba(255,209,102,.35)}
.spot b{font-size:17px}.spot p{margin:4px 0 0;font-size:12.5px;line-height:1.45;opacity:.95}
.spot .stars{position:absolute;right:12px;top:10px;font-size:12px}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
.modal.show{display:flex}
.modal .box{width:100%;max-width:360px;border-radius:20px;background:var(--panel);color:var(--text);padding:16px;text-align:center;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#card .box{animation:cardIn .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardIn{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
#card .rays{position:absolute;left:50%;top:92px;width:320px;height:320px;margin:-160px 0 0 -160px;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0 10deg,transparent 10deg 24deg);border-radius:50%;animation:spin 9s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
#card .rk{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:900;font-size:13px;color:#06192a}
#card .art{height:130px;display:flex;align-items:center;justify-content:center;position:relative;margin:6px 0 2px}
#card .art img,#card .art canvas{max-width:230px;max-height:124px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));animation:flop 1.6s ease-in-out infinite}
@keyframes flop{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
#card .art img.v-gold{filter:sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.12) drop-shadow(0 0 12px rgba(255,200,40,.9))}
#card .art img.v-albino{filter:grayscale(1) brightness(1.55) contrast(.9) drop-shadow(0 0 10px rgba(255,190,210,.8))}
#card .nm{font-size:22px;font-weight:900;margin:2px 0}
#card .stats{display:flex;justify-content:center;gap:8px;margin:8px 0}
#card .stats div{flex:1;background:var(--card);border-radius:12px;padding:6px 4px;font-size:11.5px;color:var(--muted)}
#card .stats b{display:block;font-size:17px;color:var(--text)}
#card .rec{color:var(--pink);font-weight:900;font-size:13px;min-height:18px}
#card .acts{display:flex;flex-direction:column;gap:7px;margin-top:10px}
#card .acts .bt{min-height:46px;font-size:15px}
#card .desc{font-size:12.5px;color:var(--muted);line-height:1.5;margin:4px 4px 0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 120px);transform:translateX(-50%);z-index:30;border-radius:12px;padding:8px 14px;font-weight:800;font-size:13.5px;max-width:86%;text-align:center;display:none}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
.sw{width:52px;height:30px;border-radius:999px;background:rgba(128,128,128,.4);position:relative}.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--ok)}.sw.on::after{left:25px}
h4{margin:10px 2px 6px;font-size:14px}
.it img.v-gold{filter:sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.12)}.it img.v-albino{filter:grayscale(1) brightness(1.55)}
#fight,#tourBar{pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <a id="back" class="chip glass" href="/" title="回到魚缸">🐠</a>
  <span class="chip glass">🪙 <b id="coinTxt">0</b></span>
  <span class="chip glass">💎 <b id="gemTxt">0</b></span>
  <span id="casts" class="chip glass">🎣 <b id="castTxt">10/10</b><span class="plus" id="buyCastBtn">＋</span></span>
</div>
<div id="row2">
  <button class="chip glass" id="spotChip">📍 <b id="spotTxt">淺灘</b> ▾</button>
  <span id="demo" class="glass">🧪 <i>試玩版</i>·資料只存本機</span>
</div>
<div id="tourBar" class="glass">🏆 <span id="tourTxt">釣魚大賽</span><span class="tb"><i id="tourProg"></i></span><span id="tourRank"></span></div>

  <div id="stam"><i id="stamI"></i></div>
</div>
<div id="hint"></div>
<div id="pop"></div>
<div id="reelBtn"><span>按住收線</span><small>放開＝放線</small></div>
<div id="sideBtns"><button class="sbtn glass" id="pullBtn" style="display:none">↩︎ 收竿</button></div>
<nav id="nav" class="glass">
  <button data-s="spot"><span class="e">🗺️</span>釣點</button>
  <button data-s="gear"><span class="e">🎣</span>竿與餌</button>
  <button data-s="bucket"><span class="e">🪣</span>魚簍</button>
  <button data-s="rank"><span class="e">🏆</span>排行/大賽</button>
  <button data-s="set"><span class="e">⚙️</span>設定</button>
</nav>
<div id="sheetBg"></div>
<div id="sheet"><div class="hd"><span id="shT"></span><button class="x" id="shX">✕</button></div><div class="bd" id="shB"></div></div>
<div class="modal" id="card"><div class="box" id="cardBox"></div></div>
<div class="modal" id="dlg"><div class="box" id="dlgBox"></div></div>
<div id="toast" class="glass"></div>

/* ---------- game flow ---------- */
const PERF=[.82,.95];
function castsLeft(){rollDay();return Math.max(0,CFG_F.dailyFree-S.used)+S.extra}
function useCast(){rollDay();if(S.used<CFG_F.dailyFree){S.used++;return true}if(S.extra>0){S.extra--;return true}return false}
function hint(h,s){$('#hint').innerHTML=h?E(h)+(s?`<small>${E(s)}</small>`:''):''}
function popText(t,col){const p=$('#pop');p.textContent=t;p.style.color=col||'#fff';p.classList.remove('go');void p.offsetWidth;p.classList.add('go')}
let toastT=0;function toast(t,ms=1800){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',ms)}
function setSt(s){G.st=s;G.stT=0;const busy=!['idle','result'].includes(s);$('#nav').style.opacity=busy?.35:1;$('#nav').style.pointerEvents=busy?'none':'auto';$('#row2').style.opacity=busy?.5:1;$('#spotChip').style.pointerEvents=busy?'none':'auto';
  $('#fight').style.display=s==='fight'?'block':'none';$('#reelBtn').style.display=s==='fight'?'flex':'none';$('#pullBtn').style.display=s==='wait'?'block':'none';
  if(s!=='fight')setStrain(0);
  if(s==='idle'){const n=castsLeft();n>0?hint('按住蓄力，在「完美」放開拋竿','或直接往上甩動手指 · 剩 '+n+' 次'):hint('今天的免費次數用完了','點右上角 ＋ 用 💎 增加次數')}
}
function beginCharge(px,py){
  if(castsLeft()<=0){openBuyCasts();return}
  G.charge=0;G.chargeT=0;G.down={x:px,y:py,t:performance.now()};setStrain(0);setSt('charge');hint('放開拋竿！','金色區＝完美拋竿（稀有魚機率↑）');
}
function releaseCast(px,py){
  const d=G.down,dt=Math.max(16,performance.now()-d.t),dy=d.y-py,dx=px-d.x;
  let power=G.charge,flick=false;
  if(dy>50&&dt<380){power=clamp((dy/dt-.25)/1.6,.2,1);flick=true}
  if(power<.08){setSt('idle');return}
  if(!useCast()){setSt('idle');openBuyCasts();return}
  // bait consumption
  if(S.bait!=='worm'){S.baits[S.bait]=(S.baits[S.bait]||0)-1;if(S.baits[S.bait]<=0){delete S.baits[S.bait];toast(BAITS[S.bait].name+' 用完了，下次改用蚯蚓')}}
  const baitUsed=S.bait;if(!S.baits[S.bait]&&S.bait!=='worm')S.bait='worm';
  S.stats.casts++;save();renderHud();
  const perfect=power>=PERF[0]&&power<=PERF[1];
  const meters=Math.round((8+power*44)*10)/10,z=clamp(meters/62,.12,.8),lx=clamp(dx/W*1.4,-.75,.75);
  G.cast={t:0,dur:.55+power*.35,from:tipPos(),z,lx,power,perfect,meters,bait:baitUsed};
  G.out=FORCE.next?Object.assign(rollOutcome(S.spot,baitUsed,S.rod,perfect),FORCE.next):rollOutcome(S.spot,baitUsed,S.rod,perfect);FORCE.next=null;
  G.tip.vx=-1100;G.tip.vy=700;SFX.whoosh();vib(15);

function landFloat(){
  const c=G.cast,x=xOf(c.lx,c.z),y=yOf(c.z),s=sOf(c.z);
  G.float={lx:c.lx,z:c.z,x,y,s,dip:0,dipV:0,bob:0};ripple(x,y,s,46,1.4);ripple(x,y,s,26,1);splash(x,y,s,10,.7);SFX.plop(false);vib(20);

  t+=rnd(.4,2.6)*b.wait;ev.push({t,ty:'bite'});

function onWaitTap(){
  const w=G.wait,f=G.float;

    const el=w.t-w.bite;

  }

    w.spooked++;
    if(Math.random()<.55||w.spooked>1){endCast('太早拉竿，魚被嚇跑了…','spook');return}
    toast('差點把魚嚇跑！再等等…');const rest=w.ev.filter(e=>e.t>w.t);rest.forEach(e=>e.t+=rnd(1.2,2.4));return

function pickState(F,o){
  const tired=F.ST<.25;let r=Math.random();
  if(o.kind!=='fish'){F.state=r<.6?'swim':'rest';F.sT=rnd(1,2);return}
  if(tired){F.state=r<.55?'rest':'swim';F.sT=rnd(.8,1.6);return}
  if(r<o.dart){F.state='warn';F.sT=.38;return}
  r=Math.random();if(r<.3)F.state='rest',F.sT=rnd(.7,1.4);else if(r<.65)F.state='swim',F.sT=rnd(1.1,2.2);else{F.state='run',F.sT=rnd(.8,1.5);F.tlx=clamp(F.lx+(Math.random()<.5?-1:1)*rnd(.5,1),-.95,.95);if(Math.random()<.35+o.r*.1)F.jump=0}

const PULL={rest:.15,swim:.5,run:1.0,warn:.3,dart:1.65};
function updateFight(dt){
  const F=G.fish,o=G.out,rod=RODS[S.rod];F.sT-=dt;
  if(F.sT<=0){if(F.state==='warn'){F.state='dart';F.sT=.32;F.T+=(G.hold?30:8)/rod.power;vib([20,20,45]);const z=clamp(F.D/62,.03,.8);splash(xOf(F.lx,z),yOf(z),sOf(z),12,.9);SFX.splash();G.shake=.25}else pickState(F,o)}

  if(F.state!=='warn')F.dartWarn=0;
  const tired=F.ST<.25;
  F.pull=PULL[F.state]*o.S*(.35+.65*F.ST)*(tired?.6:1);
  if(F.state==='run'||F.state==='dart'){F.tlx+=(Math.random()-.5)*dt*2}
  if(F.state==='rest')F.tlx=lerp(F.tlx,0,dt*.4);
  F.vlx+=((F.tlx-F.lx)*3-F.vlx*2.2)*dt*(F.state==='run'||F.state==='dart'?3:1.2);F.lx=clamp(F.lx+F.vlx*dt,-1,1);

  // stamina
  F.ST=clamp(F.ST-Math.pow(F.T/100,1.2)*(G.hold?.16:.05)/o.pool*dt+(F.T<15?.02*dt:0),0,1);

  if(F.T>88)hint('太緊了！快放手！','');else if(F.slack>slackLim*.45)hint('線太鬆！快按住收線！','');else if(tired)hint('魚累了！快收線！','');else if(F.state==='warn')hint('魚要衝刺了，先放手！','');else hint(G.hold?'收線中…':'放線中…','');

}

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;G.t+=dt;G.stT+=dt;const t=G.t,sp=SPOTS[S.spot];
  // state updates
  if(G.st==='charge'){G.chargeT+=dt;const ph=(G.chargeT/1.25)%2;G.charge=ph<1?ph:2-ph}
  // rod spring target
  let tx=Math.sin(t*1.2)*2,ty=Math.sin(t*1.7)*1.5;
  if(G.st==='charge'){tx=34*G.charge;ty=-30*G.charge}
  if(G.st==='fight'&&G.fish){const F=G.fish,z=clamp(F.D/62,.03,.8),fx=xOf(F.lx,z),fy=yOf(z),tb=tipBase(),dx=fx-tb.x,dy=fy-tb.y,dl=Math.hypot(dx,dy)||1,k=F.T*.62;tx=dx/dl*k*.9;ty=dy/dl*k*.6+F.T*.38;if(F.T>80){tx+=rnd(-2,2);ty+=rnd(-2,2)}}

    <div class="row"><span>📳 震動</span><span class="sw ${S.set.vib?'on':''}" data-set="vib"></span></div>
    <div class="row"><button class="bt ghost" data-act="help">❓ 怎麼玩</button><button class="bt ghost" data-act="reset">🗑 重置試玩資料</button></div>
    <p class="note">🧪 這是獨立的<b>試玩版</b>，所有金幣、鑽石、魚都只存在這支手機的瀏覽器（localStorage），不會影響正式遊戲帳號。</p>`}
  B.innerHTML=h;
  B.querySelectorAll('canvas[data-rod]').forEach(cnv=>rodIcon(cnv,cnv.dataset.rod));
}
function rodIcon(cnv,k){const c=cnv.getContext('2d'),r=RODS[k];c.clearRect(0,0,104,80);c.lineCap='round';if(r.glow){c.shadowColor=r.glow;c.shadowBlur=10}for(let i=0;i<10;i++){const u=i/10,u2=(i+1)/10;c.strokeStyle=i<2?'#2a1a12':(k==='dragon'&&i%3===0?r.col2:r.col);c.lineWidth=lerp(8,2,u);c.beginPath();c.moveTo(10+u*84,72-u*64+Math.sin(u*3)*6);c.lineTo(10+u2*84,72-u2*64+Math.sin(u2*3)*6);c.stroke()}}
$('#shB').addEventListener('click',e=>{const t=e.target.closest('[data-spot],[data-tab],[data-eq-rod],[data-buy-rod],[data-eq-bait],[data-buy-bait],[data-sell],[data-set],[data-act],[data-tour]');if(!t)return;const d=t.dataset;
  if(d.spot){S.spot=d.spot;save();renderHud();closeSheet();toast('移動到 '+SPOTS[d.spot].name);preloadArt();setSt('idle');return}
  if(d.tab){subTab[curSheet]=d.tab}
  if(d.eqRod){S.rod=d.eqRod;toast('裝備 '+RODS[d.eqRod].name)}
  if(d.buyRod){const r=RODS[d.buyRod];if(!spend(r.cur,r.price))return;S.rods[d.buyRod]=1;S.rod=d.buyRod;SFX.coin();toast('買到 '+r.name+'！');vib(30)}
  if(d.eqBait){S.bait=d.eqBait;toast('改用 '+BAITS[d.eqBait].name)}
  if(d.buyBait){const b=BAITS[d.buyBait];if(!spend(b.cur,b.price))return;S.baits[d.buyBait]=(S.baits[d.buyBait]||0)+b.pack;S.bait=d.buyBait;SFX.coin();toast('+'+b.pack+' '+b.name)}
  if(d.sell){const it=S.bucket.find(i=>i.uid==d.sell);if(it){it.dest='sold';S.coins+=it.price;SFX.coin();toast('+🪙'+fmt(it.price))}}
  if(d.set){if(d.set==='theme'){S.set.theme=themeNow()==='dark'?'light':'dark';applyTheme()}else{S.set[d.set]=!S.set[d.set];if(d.set==='sound'&&!S.set.sound)setStrain(0)}}
  if(d.act==='help'){closeSheet();showHelp()}
  if(d.act==='reset'){if(confirm('確定清除所有試玩資料？')){localStorage.removeItem(KEY);location.reload()}return}
  if(d.tour==='start')startTour();if(d.tour==='end')finishTour(true);
  save();renderHud();renderSheet()});
function spend(cur,n){if(cur==='coin'){if(S.coins<n){toast('🪙 金幣不足');return false}S.coins-=n}else if(cur==='gem'){if(S.gems<n){toast('💎 鑽石不足');return false}S.gems-=n}return true}
/* ---------- tournament (DEMO: bots simulated locally) ---------- */
const TOUR_MS=10*60*1000;
function startTour(){const now=Date.now(),rng=seeded('tour'+now);const bots=BOTS.slice().sort(()=>rng()-.5).slice(0,7).map(n=>{const rate=.5+rng()*1.3,c=[];let t=rng()*40e3;while(t<TOUR_MS){const r=rng();c.push([Math.round(t),Math.round(r<.7?60+rng()*120:r<.93?180+rng()*260:400+rng()*500)]);t+=60e3/rate*(.5+rng())}return{n,c}});
  S.tour={start:now,end:now+TOUR_MS,score:0,n:0,bots,done:false};save();toast('🏆 釣魚大賽開始！10 分鐘內積分最高者獲勝');closeSheet()}
function botScore(b,el){let s=0;for(const[t,p]of b.c)if(t<=el)s+=p;return s}
function tourRanks(){const T=S.tour,el=Math.min(Date.now(),T.end)-T.start;const rows=T.bots.map(b=>({n:b.n,s:botScore(b,el)}));rows.push({n:'你',s:T.score,me:1});rows.sort((a,b)=>b.s-a.s||(a.me?-1:1));return rows}
let tourLast=0;
function tourTick(){const now=Date.now();if(now-tourLast<250)return;tourLast=now;const T=S.tour,bar=$('#tourBar');
  if(!T||T.done){bar.style.display='none';$('#fight').style.top='';return}
  bar.style.display='flex';$('#fight').style.top='calc(env(safe-area-inset-top) + 116px)';
  const left=Math.max(0,T.end-now),m=Math.floor(left/60000),s=Math.floor(left/1000)%60,rows=tourRanks(),rk=rows.findIndex(r=>r.me)+1;
  $('#tourTxt').textContent=`大賽 ${m}:${String(s).padStart(2,'0')} · ${T.score}分`;$('#tourProg').style.width=(100*(1-left/TOUR_MS))+'%';$('#tourRank').textContent='第'+rk+'名';
  if(left<=0&&G.st!=='fight'&&G.st!=='landing'&&G.st!=='result')finishTour(false);
  if(curSheet==='rank'&&(subTab.rank||'tour')==='tour'&&now%2000<260)renderSheet()}
function finishTour(early){const T=S.tour;if(!T||T.done)return;if(early){T.end=Math.min(T.end,Date.now())}const rows=tourRanks(),rk=rows.findIndex(r=>r.me)+1;T.done=true;
  const rw=rk===1?{gems:30}:rk<=3?{gems:15}:rk<=5?{coins:1500}:{coins:300};if(rw.gems)S.gems+=rw.gems;else S.coins+=rw.coins;T.rank=rk;T.rw=rw;save();renderHud();if(curSheet)closeSheet();
  dlg(`<div style="font-size:48px">${rk===1?'🥇':rk===2?'🥈':rk===3?'🥉':'🎖️'}</div><div class="nm" style="font-size:20px;font-weight:900">釣魚大賽結束！</div><p>你是 <b>第 ${rk} 名</b>（${T.score} 分 · ${T.n} 條）</p><p>獎勵：<b>${rw.gems?'💎'+rw.gems:'🪙'+fmt(rw.coins)}</b></p><p class="note"><span class="demoT">DEMO</span>：對手為模擬資料，獎勵只發到本機試玩帳戶。</p><button class="bt" onclick="closeDlg()">好</button>`);SFX.win(2)}
function tourHTML(){const T=S.tour;let h='';
  if(!T||T.done){h+=`<div class="it" style="flex-direction:column;align-items:stretch;text-align:center"><div style="font-size:40px">⏱🎣</div><b style="font-size:16px;color:var(--text)">10 分鐘釣魚大賽</b><div class="tx" style="text-align:center">10 分鐘內釣到的魚換算積分：尺寸比 × 稀有度（普通1/稀有2/傳說4/限定8）× 變種（白化1.6/金色3）× 巨物1.3。<br>獎勵（示範）：🥇💎30 · 🥈🥉💎15 · 4–5名🪙1,500 · 參加獎🪙300</div><button class="bt" data-tour="start" style="margin-top:8px">開始大賽（免費報名）</button></div>`;
    if(T&&T.done)h+=`<p class="note">上一場：第 ${T.rank} 名 · ${T.score} 分 · ${T.n} 條</p>`;return h}
  const rows=tourRanks(),left=Math.max(0,T.end-Date.now());
  h+=`<p style="font-weight:900;text-align:center">剩餘 ${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')} · 你 ${T.score} 分（${T.n} 條）</p><table class="lb">`+rows.map((r,i)=>`<tr class="${r.me?'me':''}"><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td>${E(r.n)}${r.me?'':' <small class="demoT">DEMO</small>'}</td><td>${r.s} 分</td></tr>`).join('')+`</table><div class="row"><button class="bt ghost" data-tour="end">提前結算（測試用）</button></div>`;return h}
function sizeBoardHTML(){const tab=subTab.sizeSpot||S.spot;let h=`<div class="tabs">${Object.entries(SPOTS).map(([k,s])=>`<button data-size-spot="${k}" class="${tab===k?'on':''}">${s.emoji}${s.name}</button>`).join('')}</div>`;
  const sp=SPOTS[tab],rng=seeded(dayKey()+tab),rows=BOTS.map(n=>{const r=rng()<.2?2:rng()<.5?1:0,id=sp.pool[r][Math.floor(rng()*sp.pool[r].length)],info=spInfo(id);return{n,id,cm:Math.round(info.cm*(.9+rng()*.55)*10)/10}});
  const me=S.today[tab];if(me)rows.push({n:'你',id:me.id,cm:me.cm,me:1,variant:me.variant});rows.sort((a,b)=>b.cm-a.cm);
  h+=`<table class="lb">`+rows.map((r,i)=>{const s=spInfo(r.id);return`<tr class="${r.me?'me':''}"><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td>${E(r.n)}${r.me?'':' <small class="demoT">DEMO</small>'}<br><small class="r${s.r}">${E(s.name)}</small></td><td>${r.cm.toFixed(1)} cm</td></tr>`}).join('')+'</table>';
  if(!me)h+=`<p class="note">今天還沒在${sp.name}釣到魚，釣一條就會上榜。</p>`;return h}
$('#shB').addEventListener('click',e=>{const t=e.target.closest('[data-size-spot]');if(t){subTab.rank='size';subTab.sizeSpot=t.dataset.sizeSpot;renderSheet()}});
/* ---------- help ---------- */
function showHelp(){dlg(`<div class="nm" style="font-size:20px;font-weight:900">🎣 怎麼釣魚</div><div style="text-align:left;font-size:13.5px;line-height:1.7">
<b>1. 拋竿</b>：按住螢幕蓄力，力道條到<b style="color:#c78a00">金色「完美」</b>放開（稀有魚↑）；也可以直接<b>往上甩</b>手指。<br>
<b>2. 等咬餌</b>：浮標輕輕點一下是<b>試探</b>，別急！浮標<b>整個沉下去</b>、出現圓圈時馬上點擊。圓圈還是金色時點＝完美上鉤。<br>
<b>3. 收線拉扯</b>：<b>按住＝收線</b>，放開＝放線。拉力條保持<b style="color:#2f9e6a">綠色</b>；魚喊「要衝了」或進入黃紅區要<b>放手</b>，不然會<b>斷線</b>；放太久太鬆魚會<b>脫鉤</b>。魚累了（粉紅條變少）就快收！<br>
<b>4. 釣到後</b>：選 放入魚缸 / 收進倉庫 / 賣掉。<br>
💎 高級竿更耐拉更漂亮；💎 高級餌才釣得到<b style="color:var(--r3)">釣魚限定魚</b>與<b>金色變種</b>。</div>
<p class="note">🧪 試玩版 · 資料只存在本機</p><button class="bt" onclick="closeDlg()">開始釣魚！</button>`)}
/* ---------- art preload ---------- */
function preloadArt(){for(const ids of Object.values(SPOTS[S.spot].pool))for(const id of ids){const s=spInfo(id);if(s.art)artImg(s)}}
/* ---------- test hooks (headless QA) ---------- */
const FORCE={next:null};
window.FISH={G,S,FORCE,SPOTS,RODS,BAITS,spInfo,rollOutcome,
  state:()=>({st:G.st,T:G.fish&&G.fish.T,D:G.fish&&G.fish.D,ST:G.fish&&G.fish.ST,fs:G.fish&&G.fish.state,bite:G.wait&&G.wait.bite,wt:G.wait&&G.wait.t,hookW:G.wait&&G.wait.hookW,charge:G.charge,out:G.out}),
  sim(n=2000,spot=S.spot,bait='worm',rod='bamboo'){const c={fish:0,chest:0,bottle:0,r:[0,0,0,0],gold:0,albino:0,giant:0};for(let i=0;i<n;i++){const o=rollOutcome(spot,bait,rod,false);c[o.kind]++;if(o.kind==='fish'){c.r[o.r]++;if(o.variant)c[o.variant]++;if(o.giant)c.giant++}}return c}};
/* ---------- boot ---------- */
renderHud();setSt('idle');preloadArt();requestAnimationFrame(frame);
if(!S.seen){S.seen=true;save();setTimeout(showHelp,300)}
</script>
